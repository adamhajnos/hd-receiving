<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>HD Backstage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#15120F; --panel:#201B16; --line:rgba(244,236,220,.14); --fg:#F4ECDC; --muted:#B9AE9A;
  --ok:#7FC4A8; --ok-bg:rgba(127,196,168,.14);
  --warn:#EBC85A; --warn-bg:rgba(235,200,90,.14);
  --bad:#E8715E; --bad-bg:rgba(232,113,94,.14);
  --display:'Inter',-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif; --mono:'Inter',-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#0d0b09;color:var(--fg);font-family:var(--display);font-size:21px;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#sizer{position:relative}
#device{position:absolute;left:0;top:0;transform-origin:0 0}
#screen{position:relative;width:1194px;height:834px;overflow:hidden;background:var(--bg)}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:20px 28px 28px}
/* device mockup (desktop only) */
#device.mock{padding:34px;border-radius:58px;background:linear-gradient(145deg,#3a3631,#161412 40%,#0a0908);
  box-shadow:0 0 0 2px #4a453e,0 0 0 3px #0a0908,0 40px 90px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.06)}
#device.mock #screen{border-radius:26px;box-shadow:0 0 0 2px #000}
#device.mock #scroll{top:30px}
#device.mock::before{content:"";position:absolute;top:13px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b3a4a,#06080a 70%)}
#device.mock::after{content:"";position:absolute;top:-4px;right:90px;width:46px;height:4px;border-radius:3px 3px 0 0;background:#2a2622}
.sb{display:none;position:absolute;top:0;left:0;right:0;height:30px;padding:0 26px;align-items:center;justify-content:space-between;font:600 13px var(--display);color:var(--fg);z-index:5;background:var(--bg);pointer-events:none}
#device.mock .sb{display:flex}
.bat{display:inline-block;width:25px;height:12px;border:1.5px solid var(--muted);border-radius:4px;position:relative;margin-left:6px;vertical-align:-2px}
.bat::before{content:"";position:absolute;inset:1.5px;background:var(--fg);border-radius:1.5px}
.bat::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--muted);border-radius:0 1px 1px 0}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:#0d0b09;color:var(--fg);align-items:center;justify-content:center;text-align:center;font:800 26px var(--display);padding:40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-.01em}
h1 small{display:block;font:500 17px var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:2px}
h2{margin:0;font-size:32px;font-weight:800}
.who{display:flex;align-items:center;gap:10px}
.chip{font:500 20px var(--mono);padding:0 18px;min-height:62px;display:flex;align-items:center;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.btn{min-height:64px;padding:0 28px;border-radius:14px;border:0;font-weight:800;font-size:22px;background:var(--fg);color:var(--bg)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg);font-weight:700}
.btn.go{background:var(--ok);color:#0c1a14}
.btn.warn{background:var(--warn);color:#1d1604}
.btn:disabled{opacity:.35;cursor:default}
.hint{margin:0;color:var(--muted);font-size:20px}
.banner{font:500 18px var(--mono);border-radius:10px;padding:10px 14px;color:var(--bad);background:var(--bad-bg)}
.banner.demo{color:var(--warn);background:var(--warn-bg)}
/* sign-in */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.name{min-height:96px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-size:24px;font-weight:800}
.name:active{background:var(--fg);color:var(--bg)}
/* PIN login */
.login{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:12px}
.dots{display:flex;gap:18px;min-height:28px}
.dots i{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--fg);border-color:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,104px);gap:14px}
.pad button{height:88px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font:500 34px var(--mono)}
.pad button:active{background:var(--fg);color:var(--bg)}
.pad .fn{font:700 18px var(--display);color:var(--muted);border-color:transparent;background:none}
/* home tiles */
.tiles .tile{min-height:92px;padding:14px 18px}
.tile.pill{min-height:64px;min-width:230px;padding:8px 18px;gap:2px;justify-content:center}.tile.pill .t{font-size:28px}.tile.pill .s{font-size:17px}.lnk{background:none;border:0;padding:6px 0;font:inherit;color:var(--fg);text-decoration:underline;min-height:44px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}.col{display:flex;flex-direction:column;gap:10px;min-width:0}.col .tile{min-height:118px;padding:14px 18px}.col .tile .t{font-size:26px}.cat{margin:6px 0 2px;font:600 17px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:150px;padding:18px 20px;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.tile .t{font-weight:800;font-size:28px;line-height:1.15}
.tile .s{font:500 18px var(--display);line-height:1.25;color:var(--muted)}
.tile.todo{border-color:var(--warn);background:var(--warn-bg)}
.tile.todo .s{color:var(--warn)}
.tile.done{border-color:var(--ok);background:var(--ok-bg)}
.tile.done .s{color:var(--ok)}
.tile.soon{border:1.5px dashed var(--line);background:none;cursor:default}
.tile.soon .t{color:var(--muted);font-weight:500}
.feed h3{margin:0 0 10px;font:500 17px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.row{display:flex;gap:14px;align-items:baseline;padding:12px 4px;border-top:1px solid var(--line)}
.row .tm{flex:none;width:110px;font:500 18px var(--mono);color:var(--muted)}
.row .wh{flex:none;width:110px;font-weight:700}
.row .sm{min-width:0}
/* forms */
.top{display:flex;align-items:center;gap:16px}
.form{display:flex;flex-direction:column;gap:14px;max-width:720px}
label{display:flex;flex-direction:column;gap:6px;font-weight:700}
label span.o{font-weight:500;color:var(--muted)}
input,textarea{font:500 25px var(--display);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:0 16px;min-height:70px;width:100%}
textarea{padding:14px 16px;min-height:140px;resize:vertical}
input.money{font:500 34px var(--mono);min-height:72px}
.pre{position:relative}
.pre b{position:absolute;left:18px;top:50%;transform:translateY(-50%);font:500 30px var(--mono);color:var(--muted)}
.pre input{padding-left:44px}
.tight{gap:18px}.tight .pair{gap:18px}.tight label{gap:7px}.tight input,.tight select{min-height:58px}.tight .fmts button{min-height:54px}.tight .btn{min-height:52px}
.rlist{display:flex;flex-direction:column;gap:10px}
.rlist.two{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.rlist.two .rrow{grid-template-columns:1fr auto auto auto;font-size:18px;padding:8px 12px;gap:10px}.rlist.two .rb{width:48px;height:48px;min-height:0;font-size:22px}
.rrow{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:18px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:24px}
.rrow.part{border-color:var(--warn)}.rrow.ok{border-color:var(--ok);background:var(--ok-bg)}.rrow.over,.rrow.bad{border-color:var(--warn);background:var(--warn-bg)}
.rprice{font:700 26px var(--mono)}.rcnt{font:600 22px var(--mono);min-width:110px;text-align:right}
.rbs{display:flex;gap:8px}.rb{min-width:56px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:none;font-size:26px;font-weight:700}
.rlast{display:flex;align-items:baseline;gap:18px;padding:12px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--ok);font-size:22px}.rlast b{font:700 30px var(--mono);color:var(--ok);margin-left:auto}
.row2{display:flex;align-items:center;gap:18px}.calc{font:600 28px var(--mono)}
select{font:500 25px var(--display);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:0 16px;min-height:64px;width:100%}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
/* opening gate */
.openbig{width:100%;min-height:380px;border-radius:24px;border:1.5px solid var(--warn);background:var(--warn-bg);font:800 72px var(--display);color:var(--warn)}
.openbig:active{background:var(--warn);color:#1d1604}
.orow{padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:12px}
.orow.d{border-color:var(--ok);background:var(--ok-bg)}
.orow.c{border-color:var(--warn);background:var(--warn-bg)}
.otop{display:flex;align-items:center;justify-content:space-between;gap:14px}
.otitle{font-weight:700;font-size:26px}
.obtns{display:flex;gap:10px;flex:none}
.ob{min-height:64px;min-width:130px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:800;font-size:23px}
.ob.d.on{background:var(--ok);color:#0c1a14;border-color:var(--ok)}
.ob.c.on{background:var(--warn);color:#1d1604;border-color:var(--warn)}
.orow input{min-height:62px;font-size:24px}
.orow .pre input{font:500 26px var(--mono);padding-left:40px}
.orow .pre b{font-size:24px}
.fmts{display:flex;gap:10px;flex-wrap:wrap}
.fmts button{min-height:62px;padding:0 26px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:700;font-size:23px}
.fmts button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.npop{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50}.npop .card{width:760px;max-width:92%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 38px;display:flex;flex-direction:column;gap:18px}.npop .nl{display:block;font:500 15px var(--mono);opacity:.7;margin-bottom:6px}.npop .tx{font-size:30px;font-weight:700;line-height:1.3;white-space:pre-wrap}
.note{padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:24px;font-weight:700}
.note .nl{display:block;font:500 16px var(--mono);letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.iimg{width:160px;height:120px;object-fit:cover;border-radius:12px;display:block}
.tile{min-height:130px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.hero .tile{min-height:120px;border-width:1.5px}
.hero .tile .t{font-size:34px}
.hero .tile .s{font-size:16px}
div.tile.done{cursor:default}
/* trove list */
.findbar{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--mut,inherit);font-size:25px;text-align:left;margin:0 0 12px}.findbar b{opacity:.7;font-size:24px}
.xbtn{min-width:56px;min-height:56px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:26px;line-height:1}
.fgrp{font:600 15px var(--mono);letter-spacing:.08em;opacity:.8;margin:14px 0 8px}
.fres{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center;padding:14px 18px 14px 22px;border:1px solid var(--line);border-left:10px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px}
.fres.in{border-left-color:var(--ok)}.fres.out{border-left-color:var(--warn)}.fres.ord{border-left-color:#7aa7ff}
.fres .nm{font-size:27px}.fres .pr{font:700 26px var(--mono)}
.fres .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fres .stk{font:800 22px var(--mono);padding:8px 16px;border-radius:12px;letter-spacing:.03em}
.fres.in .stk{background:var(--ok);color:#06150e}.fres.out .stk{background:var(--warn);color:#1b1100}.fres.ord .stk{background:#7aa7ff;color:#08142b}
.fres .gn{font:800 22px var(--mono);padding:8px 16px;border-radius:999px;border:2px solid var(--fg);text-transform:uppercase;letter-spacing:.04em}
.fres .wh{font-size:21px;opacity:.8;flex:1}
.fres .rq{min-height:52px;padding:0 22px}
.tbar{display:flex;gap:12px;align-items:center}
.tbar input{flex:1}
.tchip{min-height:70px;padding:0 22px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:700;font-size:22px;white-space:nowrap}
.tchip.on{background:var(--fg);color:var(--bg)}
.tloc{position:sticky;top:-20px;z-index:3;display:flex;align-items:center;justify-content:space-between;margin:22px -8px 10px;padding:14px 18px;border-radius:12px;border-left:8px solid var(--warn);background:#2d261d;font:800 24px var(--display);letter-spacing:.04em;color:var(--fg);text-transform:uppercase;box-shadow:0 6px 10px rgba(0,0,0,.45)}.tloc .n{font:700 20px var(--mono);color:var(--warn);letter-spacing:0}
.trow{display:flex;align-items:center;gap:16px;width:100%;min-height:68px;padding:10px 16px;margin-bottom:8px;text-align:left;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.trow .box{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:20px;color:#0c1a14}
.trow.on{border-color:var(--ok);background:var(--ok-bg)}
.trow.on .box{background:var(--ok);border-color:var(--ok)}
.cov{flex:none;width:56px;height:56px;border-radius:8px;object-fit:cover;background:#2a241d}
.cov.ph{display:flex;align-items:center;justify-content:center;font:700 17px var(--mono);color:var(--muted);letter-spacing:.04em}
.trow .tx{flex:1;min-width:0}
.trow .pr{flex:none;font:500 28px var(--mono);color:var(--fg)}
.trow b{display:block;font-size:25px}
.trow b+span{display:block;color:var(--muted);font-size:21px}
.tpanel{display:flex;align-items:center;gap:18px;padding:14px 20px;margin:10px 0 6px;border-radius:16px;border:2px solid var(--line);background:var(--panel);min-height:96px}
.tpanel .big{flex:1;min-width:0;font-size:30px}.tpanel .big small{display:block;font:600 17px var(--mono);letter-spacing:.08em;opacity:.75;text-transform:uppercase;margin-bottom:4px}
.tpanel .big span{display:block;font-size:22px;opacity:.8}
.tpanel.ok{border-color:var(--ok);background:var(--ok-bg)}.tpanel.bad{border-color:#ff5a4d;background:rgba(255,90,77,.18);animation:flash .5s 2}.tpanel.dup{border-color:var(--warn)}
@keyframes flash{50%{background:rgba(255,90,77,.55)}}
.tpanel .btn{min-height:56px}
.addpick{display:grid;grid-template-columns:1fr;gap:14px;margin-top:8px}.addpick .btn{min-height:124px;font-size:34px;font-weight:800;text-align:left;padding:14px 26px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}.addpick .btn small{font:400 20px var(--display);opacity:.72}
.tact{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 12px}
.tact .btn{min-height:104px;font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.25;text-align:left;padding:12px 22px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.tact .btn small{font:400 18px var(--display);opacity:.72;letter-spacing:0}
.trow.ro{cursor:default}.trow.ro .gpill{flex:none;font:700 17px var(--mono);padding:5px 12px;border-radius:999px;border:1.5px solid var(--fg);text-transform:uppercase}
.trow.ro .grip{flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:32px;color:var(--muted);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border:1px solid var(--line)}
.trow.ro.drag{border-color:var(--warn);background:var(--warn-bg);box-shadow:0 10px 24px rgba(0,0,0,.6);position:relative;z-index:4}
.guide{margin-top:14px;padding:24px 28px;border-radius:18px;border:1px solid var(--line);background:var(--panel)}
.guide h3{margin:0 0 18px;font:800 32px var(--display)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.steps li{display:flex;gap:20px;align-items:flex-start}
.steps .num{flex:none;width:56px;height:56px;border-radius:50%;background:var(--warn);color:#1d1604;display:flex;align-items:center;justify-content:center;font:800 30px var(--display)}
.steps b{font-size:28px}.steps p{margin:4px 0 8px;font-size:23px;color:var(--muted);line-height:1.35}.steps p+.btn{min-height:56px;font-size:20px}
.dtok{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 12px;padding:14px 18px;border-radius:14px;border:1px dashed var(--line)}.dtok b{font-size:22px}.dtok span{font-size:19px;color:var(--muted);flex:1;min-width:240px}.dtok input{flex:1;min-width:260px;max-width:420px;min-height:60px}.dtok .btn{min-height:60px}
.bigstart{width:100%;margin-top:18px;min-height:130px;border-radius:22px;border:0;background:var(--ok);color:#0c1a14;font:800 46px var(--display)}
.tp{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.prog{display:flex;align-items:center;gap:20px}.prog .pc{flex:none;font:800 30px var(--display)}
.bar{flex:1;height:18px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.nextcard{display:flex;gap:24px;align-items:center;padding:20px 24px;border-radius:18px;border:2px solid var(--warn);background:var(--warn-bg)}
.nextcard .cov{width:128px;height:128px;border-radius:12px;font-size:30px}
.nextcard .lbl{font:800 19px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.nextcard b{display:block;font-size:40px;line-height:1.15}.nextcard span{display:block;font-size:28px;opacity:.9;margin-top:2px}
.nextcard em{display:inline-block;margin-top:10px;font:700 24px var(--mono);font-style:normal;padding:6px 16px;border-radius:999px;border:2px solid var(--fg)}
.tmsg{padding:18px 24px;border-radius:16px;border:2px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.tmsg b{font-size:30px}.tmsg span{font-size:24px;opacity:.85;flex:1;min-width:0}
.tmsg.ok{border-color:var(--ok);background:var(--ok-bg)}.tmsg.dup{border-color:var(--warn);background:var(--warn-bg)}
.tmsg.bad{border-color:#ff5a4d;background:rgba(255,90,77,.2);animation:flash .5s 2}
.tconf{display:flex;flex-direction:column;gap:8px;padding:18px 22px;border-radius:16px;border:2px solid var(--warn);background:#2a2214}.tconf b{font-size:28px}.tconf span{font-size:22px;opacity:.85}.tcb{display:flex;gap:14px;margin-top:8px}
.stickybar>.btn{width:100%}.stickybar .btn{min-height:72px;font-size:25px}.stickybar{position:sticky;bottom:-28px;margin:16px -28px -28px;padding:14px 28px 28px;background:linear-gradient(transparent,var(--bg) 30%)}
/* checklist */
.steps{display:flex;flex-direction:column;gap:10px;max-width:720px}
.step{display:flex;align-items:center;gap:16px;min-height:72px;padding:12px 18px;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:20px;width:100%}
.box{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:22px;color:#0c1a14}
.step.on{border-color:var(--ok);background:var(--ok-bg)}

<script>
(function(){

async function api(action, payload){

  const openTile='<div class="tile pill done" aria-label="Opening done"><span class="t">Open</span><span class="s">Done \u00b7 '+fmtTime(op.ts)+'</span></div>';
  const closeTile=cl

  const cat=(n,body)=>'<div class="col"><h3 class="cat">'+n+'</h3>'+body+'</div>';
  return headerHTML(openTile+closeTile)+bannerHTML()+noteHTML()+'<button class="findbar" data-act="go:find"><b>\u2315</b> Find a record</button><div class="cols">'+
    cat('Records',tile('go:trove','Trove records','See the list, or check the shelf')+tile('go:addrecord','Add records','New, Trove or used')+tile('go:labels','Print labels','Print the sticker sheet for new records'))+
    cat('Beer',tile('go:kegs','Beer menu','Kick a keg, change a price, put one on tap')+tile('go:rkeg','Receive keg','Log a delivery, with the invoice photo'))+
    cat('Customers',tile('go:dropoff','Customer drop&#8209;off','Log records a customer left'+(dr?' \u00b7 '+dr+' today':''))+tile('go:request','Customer request','Record what a customer is looking for'))+
    cat('Shop',tile('go:note','Note for next shift','Leave a heads-up for whoever opens')+tile('go:issue','Report an issue','Flag a problem for the manager'))+'</div>';
}
function topHTML(t,act,right,nohome){ return '<div class="top"><button class="btn ghost" data-act="'+(act||'home')+'">\u2039 Back</button><h2>'+t+'</h2>'+(right||'')+'</div>'; }

const K=()=>'hd.'+(S.flow==='closing'?'close':'open')+'.'+today();
const KT=()=>'hd.trove.'+(S.tstand?'s':S.flow==='closing'?'c':'o')+'.'+today();
function steps_(){ return (S.flow==='closing'?C.CLOSING:C.OPENING).map(s=>typeof s==='string'?{t:s}:s); }
function validAmt(v){ return /^\d+(\.\d{0,2})?$/.test(String(v||'').trim()); }
function resolved_(i){
  const st=S.open[i], s=steps_()[i]; if(!st) return false;
  if(st.s==='done') return s.amount ? validAmt(st.amount) : true;
  if(st.s==='cant') return !!(st.reason||'').trim();
  return false;
}
const tkey=i=>i.artist+'|'+i.title;
const ORDKEY='hd.trove.order2';
function setTrove(L){ const o=LS.get(ORDKEY,null); L=(L||[]).slice(); if(o&&o.length){ const ix={}; o.forEach((c,n)=>ix[c]=n); const big=1e6; L=L.map((it,n)=>[it,n]).sort((a,b)=>((ix[a[0].code]??big)-(ix[b[0].code]??big))||(a[1]-b[1])).map(x=>x[0]); } S.troveList=L; }
const initials=i=>(String(i.artist||i.title||'?').replace(/^the\s+/i,'').trim().slice(0,2)).toUpperCase();
const COVKEY='hd.covers';
let COV=LS.get(COVKEY,{});
const covKey=i=>(i.artist+'|'+i.title).toLowerCase();
function covHTML(i){
  const u=i.cover||COV[covKey(i)];
  return u ? '<img class="cov" loading="lazy" alt="" src="'+esc(u)+'" data-ph="'+esc(initials(i))+'">' : '<div class="cov ph" data-k="'+esc(covKey(i))+'" data-a="'+esc(i.artist)+'" data-t="'+esc(i.title)+'">'+esc(initials(i))+'</div>';
}
// Cover art: looked up from Apple's free search (no key) when a row scrolls into view, then remembered on this device.
let _covQ=[], _covBusy=false, _covIO=null, _covStop=0;
function covClean(t){ return String(t||'').replace(/\([^)]*\)/g,' ').replace(/\b(S\/T|ST|OGST|7"|45|EP)\b/gi,' ').replace(/[^\w\s&'.-]/g,' ').replace(/\s+/g,' ').trim(); }
async function covFetch(el){
  const k=el.dataset.k; if(k in COV) return;
  const a=covClean(el.dataset.a).replace(/^\*?45\*?\s*/,''), t=covClean(el.dataset.t);
  try{
    const r=await fetch('https://itunes.apple.com/search?media=music&entity=album&limit=5&term='+encodeURIComponent((a+' '+t).trim()));
    if(!r.ok) throw new Error(r.status);
    const j=await r.json(), nz=x=>String(x||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
    const aw=nz(a).filter(x=>x!=='the')[0]||'', tw=nz(t).filter(x=>x.length>2);
    let best=null, bs=0;
    (j.results||[]).forEach(x=>{ if(!nz(x.artistName).join(' ').includes(aw)) return; const cw=nz(x.collectionName); const sc=tw.length?tw.filter(w=>cw.includes(w)).length/tw.length:0; if(sc>bs){ bs=sc; best=x; } });
    const hit=bs>=0.6?best:null;
    let url=hit?hit.artworkUrl100.replace('100x100bb','200x200bb'):'';
    const DT=LS.get('hd.discogs',null), DK=C.DISCOGS_KEY, DS=C.DISCOGS_SECRET;
    if(!url&&(DT||(DK&&DS))){ // Discogs: best coverage for obscure vinyl pressings
      try{
        await new Promise(r=>setTimeout(r,1100));
        const d=await fetch('https://api.discogs.com/database/search?type=release&per_page=8&q='+encodeURIComponent((a+' '+t).trim())+(DT?'&token='+encodeURIComponent(DT):'&key='+encodeURIComponent(DK)+'&secret='+encodeURIComponent(DS))).then(r=>r.json());
        let bd=null, ds=-1;
        (d.results||[]).forEach(x=>{ const full=nz(x.title), img=x.cover_image||x.thumb||''; if(!img||/spacer\.gif/.test(img)) return; if(!full.join(' ').includes(aw)) return; const sc=tw.length?tw.filter(w=>full.includes(w)).length/tw.length:1; if(sc>ds){ ds=sc; bd=x; } });
        if(bd&&ds>=0.6) url=bd.cover_image||bd.thumb;
      }catch(e){}
    }
    if(!url){ // last source: MusicBrainz + Cover Art Archive (free, better for obscure pressings)
      try{
        await new Promise(r=>setTimeout(r,1100));
        const m=await fetch('https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=5&query='+encodeURIComponent('releasegroup:"'+t+'" AND artist:"'+a+'"')).then(r=>r.json());
        let mb=null, ms=0;
        (m['release-groups']||[]).forEach(x=>{ const an=nz((x['artist-credit']||[]).map(c=>c.name).join(' ')).join(' '); if(!an.includes(aw)) return; const cw=nz(x.title); const sc=tw.length?tw.filter(w=>cw.includes(w)).length/tw.length:0; if(sc>ms){ ms=sc; mb=x; } });
        if(mb&&ms>=0.6){ const u='https://coverartarchive.org/release-group/'+mb.id+'/front-250'; const h=await fetch(u,{method:'HEAD'}); if(h.ok) url=u; }
      }catch(e){}
    }
    COV[k]=url;
    LS.set(COVKEY,COV);
    if(COV[k]) document.querySelectorAll('.cov.ph').forEach(n=>{ if(n.dataset.k===k){ const im=document.createElement('img'); im.className='cov'; im.alt=''; im.src=COV[k]; im.dataset.ph=n.textContent; n.replaceWith(im); } });
  }catch(e){ _covStop=Date.now()+60000; }
}
async function covPump(){
  if(_covBusy) return; _covBusy=true;
  while(_covQ.length){
    if(Date.now()<_covStop){ await new Promise(r=>setTimeout(r,5000)); continue; }
    const el=_covQ.shift(); if(el.isConnected) await covFetch(el);
    await new Promise(r=>setTimeout(r,450));
  }
  _covBusy=false;
}
function coverScan(){
  if(!window.IntersectionObserver) return;
  _covIO=_covIO||new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ _covIO.unobserve(e.target); if(!(e.target.dataset.k in COV)) { _covQ.push(e.target); covPump(); } } }),{rootMargin:'200px'});
  document.querySelectorAll('.cov.ph[data-k]').forEach(n=>_covIO.observe(n));
}
function priceFmt(p){
  if(p==null||String(p).trim()==='') return '';
  const n=parseFloat(String(p).replace(/[$,]/g,''));
  if(isNaN(n)) return esc(p);
  return '$'+(Number.isInteger(n)?n:n.toFixed(2));
}
// A cover that fails to load (offline, bad URL, blocked) falls back to initials.
document.addEventListener('error',ev=>{
  const t=ev.target; if(t&&t.tagName==='IMG'&&t.classList.contains('cov')){
    const d=document.createElement('div'); d.className='cov ph'; d.textContent=t.dataset.ph||'?'; t.replaceWith(d);
  }
},true);
function troveListHTML(){
  const q=S.tq.trim().toLowerCase();
  let L=S.troveList.filter(i=>!q||(i.artist+' '+i.title+' '+i.location).toLowerCase().includes(q));
  if(S.tonly) L=L.filter(i=>!S.tfound[tkey(i)]);
  if(!L.length) return '<p class="hint" style="margin-top:20px">'+(S.tload?'Loading\u2026':'Nothing here.')+'</p>';

  L.forEach(i=>{

  });
  return out;
}
function troveSorted(){ return (S.troveList||[]).slice(); }  // shelf order = sheet order
function troveNext(){ return troveSorted().find(i=>!S.tfound[tkey(i)]); }
let _ac=null;
function beep(kind){
  try{
    _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended') _ac.resume();
    const seq = kind==='ok' ? [[880,.09,'sine']] : kind==='dup' ? [[520,.09,'sine'],[520,.09,'sine']] : [[200,.2,'square'],[200,.2,'square'],[200,.2,'square']];
    let t=_ac.currentTime; seq.forEach(([f,d,w])=>{ const o=_ac.createOscillator(), g=_ac.createGain(); o.type=w; o.frequency.value=f; g.gain.value=.25; o.connect(g); g.connect(_ac.destination); o.start(t); o.stop(t+d); t+=d+.07; });
  }catch(e){}
}
function tpanelHTML(){
  const nx=troveNext(), m=S.tmsg, c=troveCounts(), pct=c.n?Math.round(100*c.f/c.n):0;

    ? '<div class="nextcard">'+covHTML(nx)+'<div class="nx"><div class="lbl">Scan this record next</div><b>'+esc(nx.title)+'</b><span>'+esc(nx.artist)+'</span><em>Shelf: '+esc(nx.location||'?')+'</em></div></div>'

}
function tstartHTML(){

  return '<div class="guide"><h3>Check the Trove in 3 steps</h3><ol class="steps">'+
    stp(1,'Get ready','Turn the scanner on and turn the iPad volume up.','<button class="btn ghost" data-act="ttest">Test the sound</button>')+
    stp(2,'Tap the green button below','The screen will show which record to scan first.')+
    stp(3,'Scan every record, in shelf order','You\u2019ll hear a beep for each good scan. A loud buzz means a record is out of order.'+(first?' Start with <b>'+esc(first.artist)+' \u00b7 '+esc(first.title)+'</b> ('+esc(first.location||'')+').':''))+
    '</ol></div><button class="bigstart" data-act="tstart">Start scanning</button>';
}
function tfootHTML(){
  const c=troveCounts();
  if(S.tconfirm) return '<div class="stickybar" id="tfoot"><div class="tconf"><b>'+c.nf+' record'+(c.nf===1?'':'s')+' haven\u2019t been checked.</b><span>Finish anyway? They will be reported as not found.</span><div class="tcb"><button class="btn ghost" data-act="tkeep">Keep scanning</button><button class="btn warn" data-act="trovedone">Finish anyway</button></div></div></div>';
  return '<div class="stickybar" id="tfoot"><button class="btn go" id="tdone" data-act="trovedone">'+(c.nf?'Finish check ('+c.nf+' not checked)':'Finish check')+'</button></div>';
}
function troveScan(code){
  code=String(code||'').trim(); if(code.length<3) return;
  const it=(S.troveList||[]).find(i=>String(i.code||'').toLowerCase()===code.toLowerCase());
  if(!it){ S.tmsg={k:'bad',h:'Not a Trove barcode',t:code}; beep('bad'); }
  else if(S.tfound[tkey(it)]){ S.tmsg={k:'dup',h:'Already checked',t:it.artist+' \u00b7 '+it.title}; beep('dup'); }
  else{
    const nx=troveNext(), inOrder=nx&&tkey(nx)===tkey(it);
    S.tfound[tkey(it)]=true; LS.set(KT(),S.tfound);
    if(inOrder){ S.tmsg={k:'ok',h:'\u2713 Checked',t:it.artist+' \u00b7 '+it.title}; beep('ok'); }
    else{ S.tbad=S.tbad||{}; S.tbad[tkey(it)]=1; S.tmsg={k:'bad',h:'OUT OF ORDER',t:it.artist+' \u00b7 '+it.title+' is out of place. Expected: '+nx.artist+' \u00b7 '+nx.title}; beep('bad'); }
  }
  refreshTrove();
}
function tbrowseListHTML(){
  const q=(S.tbq||'').trim().toLowerCase().split(/\s+/).filter(Boolean), src=S.tseg==='back'?(C.DEMO_BACKFILL||[]):(S.troveList||[]);

  const canDrag=S.tseg!=='back'&&!q.length;
  let out='', loc=null;
  L.forEach(i=>{
    if(i.location!==loc){ loc=i.location; out+='<div class="tloc"><span>'+esc(loc||'No location')+'</span><span class="n">'+cnt[loc]+' records</span></div>'; }
    out+='<div class="trow ro" data-code="'+esc(i.code||'')+'" data-loc="'+esc(i.location||'')+'">'+(canDrag?'<span class="grip" aria-label="Drag to reorder">\u2261</span>':'')+covHTML(i)+'<span class="tx"><b>'+esc(i.title)+'</b><span>'+esc(i.artist)+'</span></span>'+(i.genre?'<span class="gpill">'+esc(i.genre)+'</span>':'')+'<span class="pr">'+priceFmt(i.price)+'</span></div>';

function findResults(){
  const q=(S.fq||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hit=t=>q.every(w=>t.toLowerCase().includes(w)), st=C.STORE||'Raleigh', out=[];
  (C.DEMO_NEW||[]).forEach(i=>{ if(hit(i.artist+' '+i.title)) out.push({store:st,a:i.artist,t:i.title,p:i.price,n:i.stock,g:i.genre,w:i.stock?('Shelf: New records, '+i.genre+' section'):'File under: New records, '+i.genre+' section'}); });
  (S.troveList||[]).forEach(i=>{ if(hit(i.artist+' '+i.title)) out.push({store:st,a:i.artist,t:i.title,p:i.price,n:1,g:i.genre||'',w:'Shelf: Trove, '+(i.location||'no location')}); });
  LS.get('hd.used',[]).forEach(i=>{ if(hit(i.artist+' '+i.title)) out.push({store:st,a:i.artist,t:i.title,p:i.price,n:1,g:i.genre||'',w:'Shelf: Used'+(i.genre?', '+i.genre+' section':'')+(i.condition?' \u00b7 '+i.condition:'')}); });
  (C.DEMO_BACKFILL||[]).forEach(i=>{ if(hit(i.artist+' '+i.title)) out.push({store:st,a:i.artist,t:i.title,p:i.price,n:1,g:i.genre||'',w:'Backfill cubby (not on the floor yet)'}); });
  (C.DEMO_ORDERS||[]).forEach(o=>o.lines.forEach(l=>{ if(hit(l.artist+' '+l.title)) out.push({store:st,a:tc(l.artist),t:tc(l.title),p:msrpPrice(l.list),n:null,g:'',w:'Not in yet. On order ('+o.id+')'}); }));
  return out;
}

function scanUPC(raw){
  const o=rOrder(); const u=nz(raw); if(!o||!u) return;
  const map=LS.get('hd.upcmap',{});
  let l=o.lines.find(x=>!x.nobar&&nz(x.upc)===u);
  if(!l&&map[u]) l=o.lines.find(x=>x.upc===map[u]);
  if(l){ S.rscan[l.upc]=(S.rscan[l.upc]||0)+1; S.rlast=l.upc; }
  else if(o.lines.some(x=>x.nobar)){ S.rpend=u; render(); return; }
  else { S.rbad[u]=(S.rbad[u]||0)+1; S.rlast=null; }
  rSave(); render(); focusScan();
}

async function kegScan(){

  const prompt='This is a photo of a beer distributor delivery invoice. Return ONLY JSON: {"supplier":string,"invoice":string,"kegs":[{"brewery":string,"beer":string,"size":string,"cost":number}]}. '+
   'Include only kegs being delivered: lines with a product and a price that are NOT crossed out or struck through. Exclude lines starting "Empty" (returned kegs), key deposits, deposits, totals. cost is the PRICE column, not the deposit. size like "1/6 bbl". '+
   'Product text looks like "Brewery-Beer Name 1/6 bbl" and may be cut off at the edge of the photo. If a name is cut off or abbreviated, use the matching entry from this known list (its exact beer and brewery spelling) when one clearly matches; otherwise give what is visible. Known beers (beer | brewery):\n'+known;
  const r = await sm.json(prompt,{images:[blob],modelTier:'default',cache:false});

function shrink(file,max){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('photo')); };
    img.src=url;
  });
}

    o.lines.forEach(l=>{ const g=S.rscan[l.upc]||0; if(g<l.qty) short.push(tc(l.artist)+' - '+tc(l.title)+' ('+g+' of '+l.qty+')'); if(g>l.qty) over.push(tc(l.artist)+' - '+tc(l.title)+' (+'+(g-l.qty)+')'); });
    const extra=Object.keys(S.rbad).map(u=>u+' x'+S.rbad[u]);
    const got=o.lines.reduce((n,l)=>n+Math.min(S.rscan[l.upc]||0,l.qty),0), total=o.lines.reduce((n,l)=>n+l.qty,0);
    submit('receive','Received order '+o.id+': '+got+' of '+total+' scanned'+(short.length?', '+short.length+' short':'')+(extra.length?', '+extra.length+' not on order':''),
      {order:o.id,expected:total,scanned:got,short,over,extra,packing:S.rpack?S.rpack.split(',')[1]:'',noPacking:S.rnopack}).then(ok=>{ if(ok){ LS.set(RK(),null); S.rorder=null; S.rscan={}; S.rbad={}; S.rlast=null; S.rpack=null; S.rnopack=false; } });
  }
  else if(a==='atype'){ S.atype=b.dataset.v; S.aprint=true; S.alisted={}; S.acond=null; render(); }
  else if(a==='kgtab'){ S.kv=b.dataset.v; render(); }
  else if(a==='ktile'){ const n=+b.dataset.n, L=kegs(); S.ks={t:L.some(x=>x.status==='tap'&&x.tap===n)?'tap':'open',n}; render(); }
  else if(a==='kclose'){ if(ev.target===b||b.tagName==='BUTTON'){ S.ks=null; render(); } }
  else if(a==='kkick'){ const L=kegs(), k=kfind(L,b.dataset.key); const n=k.tap; k.lastTap=n; k.status='empty'; k.tap=null; k.days=0; kegCommit(L,'Kicked: '+k.beer+' (tap '+n+')',{beer:k.beer,brewery:k.brewery,tap:n,action:'kick'}); }
  else if(a==='kmove'){ S.ks={t:'move',key:b.dataset.key,from:+b.dataset.n}; render(); }
  else if(a==='kdomove'){ const L=kegs(), k=kfind(L,b.dataset.key), to=+b.dataset.n, from=+b.dataset.from, o=L.find(x=>x.status==='tap'&&x.tap===to); if(o) o.tap=from; k.tap=to; kegCommit(L,o?'Swapped taps '+from+' and '+to+': '+k.beer+' / '+o.beer:'Moved '+k.beer+' from tap '+from+' to tap '+to,{beer:k.beer,from,to,action:'move'}); }
  else if(a==='kprice'){ S.ks={t:'price',key:b.dataset.key,n:+b.dataset.n}; render(); }
  else if(a==='kchip'){ const e=document.getElementById('kpr'); if(e) e.value=b.dataset.v; }
  else if(a==='ksaveprice'){ const v=parseFloat(String((document.getElementById('kpr')||{}).value||'').replace(/[^0-9.]/g,'')); if(!(v>0)){ toast('Enter a price, like 6.50'); return; }
    const L=kegs(), k=kfind(L,b.dataset.key), n=+b.dataset.n; k.price=v;
    if(n){ k.status='tap'; k.tap=n; k.days=0; kegCommit(L,'On tap '+n+': '+k.beer+' ('+kfmt(v)+')',{beer:k.beer,brewery:k.brewery,tap:n,price:v,action:'place'}); }
    else kegCommit(L,'Price: '+k.beer+' '+kfmt(v),{beer:k.beer,price:v,action:'price'}); }
  else if(a==='kplace'){ S.ks={t:'putontap',key:b.dataset.key}; render(); }
  else if(a==='kdoplace'){ const L=kegs(), k=kfind(L,b.dataset.key), n=+b.dataset.n;
    if(!k.price){ S.ks={t:'price',key:k.key,n}; render(); return; }
    k.status='tap'; k.tap=n; k.days=0; kegCommit(L,'On tap '+n+': '+k.beer+' ('+kfmt(k.price)+')',{beer:k.beer,brewery:k.brewery,tap:n,price:k.price,action:'place'}); }
  else if(a==='kundo'){ const L=kegs(), k=kfind(L,b.dataset.key), free=k.lastTap&&!L.some(x=>x.status==='tap'&&x.tap===k.lastTap); if(free){ k.status='tap'; k.tap=k.lastTap; } else k.status='deck'; kegCommit(L,'Keg restored: '+k.beer,{beer:k.beer,action:'undo'}); }
  else if(a==='kup'||a==='kdown'){ const L=kegs(), d=L.filter(x=>x.status==='deck'), i=d.findIndex(x=>x.key===b.dataset.key), j=a==='kup'?i-1:i+1; if(i<0||j<0||j>=d.length) return;
    const ia=L.indexOf(d[i]), ib=L.indexOf(d[j]); [L[ia],L[ib]]=[L[ib],L[ia]]; LS.set(KEGK,L); render(); }
  else if(a==='pqdel'){ const q=pqGet(); q.splice(+b.dataset.i,1); LS.set(PQ,q); S.pprinted=false; render(); }
  else if(a==='pqadd'){ pqAdd({code:b.dataset.c,artist:b.dataset.a,title:b.dataset.t,price:((S.troveList||[]).concat(LS.get('hd.used',[])).find(i=>(i.code||'')===b.dataset.c&&i.title===b.dataset.t)||{}).price,genre:((S.troveList||[]).concat(LS.get('hd.used',[])).find(i=>(i.code||'')===b.dataset.c&&i.title===b.dataset.t)||{}).genre}); S.pqs=''; S.pprinted=false; render(); toast('Added to the queue'); }
  else if(a==='pstart'){ LS.set(PS,+b.dataset.k); S.pprinted=false; render(); }
  else if(a==='pprint'){ doPrint(); }
  else if(a==='pqclear'){ const n=pqGet().length, st=LS.get(PS,0); LS.set(PS,(st+n)%20); LS.set(PQ,[]); S.pprinted=false; render(); toast('Queue cleared'); }
  else if(a==='addback'){ S.atype=null; render(); }
  else if(a==='addtrove'){ S.atype='Trove'; S.alisted={}; S.aprint=true; S.acond=null; go('addrec'); }
  else if(a==='acond'){ S.acond=S.acond===b.dataset.v?null:b.dataset.v; document.querySelectorAll('[data-act=acond]').forEach(x=>x.classList.toggle('on',x.dataset.v===S.acond)); }
  else if(a==='aprintq'){ S.aprint=!S.aprint; b.classList.toggle('on',S.aprint); b.textContent=S.aprint?'Added to print queue':'Add to print queue'; }
  else if(a==='alisted'){ const k=b.dataset.v; S.alisted[k]=!S.alisted[k]; b.classList.toggle('on',!!S.alisted[k]); }
  else if(a==='agen'){ const e=document.getElementById('abar'); if(e){ e.value='HD'+String(Date.now()).slice(-9); e.dispatchEvent(new Event('input')); } }
  else if(a==='saveaddrec'){
    const t=S.atype, price=parseFloat(val('aprice'));
    const d={type:t,artist:val('aartist'),album:val('aalbum'),genre:val('agenre'),format:document.getElementById('aformat').value,price,notes:val('anotes')};
    d.printLabel = t==='Trove' ? true : S.aprint;
    if(t==='Used'){ d.condition=S.acond||''; const u=LS.get('hd.used',[]); d.code='UD-'+String(u.length+1).padStart(4,'0'); }
    if(t==='Trove'){ const mx=(S.troveList||[]).reduce((m,i)=>Math.max(m,parseInt(String(i.code||'').replace(/\D/g,''))||0),0); d.code='TT-'+String(mx+1).padStart(4,'0'); d.location=val('aloc'); d.status=d.location==='Backfill'?'Backfill':'Active'; d.listed=Object.keys(S.alisted).filter(k=>S.alisted[k]).join(', '); }
    submit('record','Added '+t+': '+d.artist+' - '+d.album+' ($'+price+')',d,t==='Used').then(ok=>{ if(!ok) return;
      if(d.printLabel) pqAdd({code:d.code||'',artist:d.artist,title:d.album,genre:d.genre,price,notes:d.notes});
      if(t==='Used'){ const u=LS.get('hd.used',[]); u.push({code:d.code,artist:d.artist,title:d.album,genre:d.genre,format:d.format,price,condition:d.condition,notes:d.notes}); LS.set('hd.used',u); S.alast={genre:d.genre,format:d.format}; S.acond=null; S.aprint=true; S.view='addrec'; render(); const e=document.getElementById('aartist'); if(e) e.focus(); toast('Added \u2713 Next record'); }
      else { S.atype=null; S.alisted={}; S.aprint=true; } });
  }
  else if(a==='rfmt'){ S.rfmt=b.dataset.v; document.querySelectorAll('.fmts button').forEach(x=>x.classList.toggle('on',x===b)); }
  else if(a==='fclear'){ S.fq=''; const e=document.getElementById('fq'); if(e){ e.value=''; e.focus(); } const l=document.getElementById('flist'); if(l) l.innerHTML=findHTML(); b.style.display='none'; }
  else if(a==='freq'){ const r=(S.fres||[])[+b.dataset.i]; if(r){ S.ritems=[]; S.rc={}; S.rfmt='Vinyl'; S.rpre={artist:r.a,album:r.t}; go('request'); } }
  else if(a==='radd'||a==='rdel'){
    S.rc={name:val('rname'),phone:val('rphone'),email:val('remail')}; S.rpre=null;
    if(a==='radd'){ S.ritems.push({artist:val('rartist'),album:val('ralbum'),format:S.rfmt,notes:val('rnotes')}); S.rfmt='Vinyl'; }
    else S.ritems.splice(+b.dataset.i,1);
    render(); const e=document.getElementById('rartist'); if(e) e.focus();
  }
  else if(a==='saverequest'){
    const items=S.ritems.slice();
    if(val('rartist')&&val('ralbum')) items.push({artist:val('rartist'),album:val('ralbum'),format:S.rfmt,notes:val('rnotes')});
    submit('request','Request: '+items.map(r=>r.artist+' - '+r.album).join('; '),{name:val('rname'),phone:val('rphone'),email:val('remail'),items}).then(ok=>{ if(ok){ S.ritems=[]; S.rc={}; S.rfmt='Vinyl'; S.rpre=null; } });
  }
  else if(a==='kscandone'){ S.rkDone=null; S.iphoto=null; go('home'); }
  else if(a==='kundoscan'){ const d=S.rkDone; if(d){ const L=kegs().filter(k=>!(k.scanId===d.id)); LS.set(KEGK,L); } S.rkDone=null; S.iphoto=null; S.rk=[]; render(); toast('Undone'); }
  else if(a==='ksize'){ S.ksize=b.dataset.v; document.querySelectorAll('.fmts button[data-act=ksize]').forEach(x=>x.classList.toggle('on',x===b)); const c=document.getElementById('kcost').value, p=pourPrice(parseFloat(c),S.ksize); const q=document.getElementById('keq'); if(q) q.innerHTML=keqHTML(c); const pr=document.getElementById('kprice'); if(pr&&p!=null) pr.value=p.toFixed(2); if(S.recheck) S.recheck(); }
  else if(a==='kphoto'){ S.ksup=val('ksup'); document.getElementById('kphotoin').click(); }
  else if(a==='kadd'){ const pr=parseFloat(val('kprice')); if(!(val('kbeer')&&val('kbrew')&&pr>0)) return; S.ksup=val('ksup'); (S.rk=S.rk||[]).push({beer:val('kbeer'),brewery:val('kbrew'),price:pr}); render(); }
  else if(a==='krm'){ S.ksup=val('ksup'); S.rk.splice(+b.dataset.n,1); render(); }
  else if(a==='savekegrecv'){
    const L=kegs(), sup=val('ksup'), ks=S.rk||[];
    ks.forEach(k=>L.push({key:k.beer+'|'+k.brewery,beer:k.beer,brewery:k.brewery,style:'',price:k.price,status:'deck',tap:null,days:0,lastTap:null,supplier:sup}));
    LS.set(KEGK,L);
    submit('kegrecv','Kegs received from '+sup+': '+ks.map(k=>k.beer+' ('+kfmt(k.price)+')').join(', '),{supplier:sup,kegs:ks,photo:S.iphoto?S.iphoto.split(',')[1]:'',noPhoto:!S.iphoto},true).then(ok=>{ if(ok){ const n=ks.length; S.rk=[]; S.iphoto=null; S.ksup=''; S.view='home'; render(); toast(n+' keg'+(n===1?'':'s')+' on deck \u2713'); } });
  }
  else if(a==='savedrop'){
    const n='';
    submit('dropoff','Drop-off',{name:val('cname'),phone:val('cphone'),email:val('cemail'),items:val('citems'),count:'',photo:S.iphoto?S.iphoto.split(',')[1]:''});
  }
});


/* ---------- fixed iPad landscape canvas + mockup ---------- */
function fit(){
  const coarse = matchMedia('(pointer:coarse)').matches;
  const mock = C.MOCKUP==='auto' ? !coarse : !!C.MOCKUP;
  const dev=document.getElementById('device'), sz=document.getElementById('sizer');
  dev.classList.toggle('mock',mock);
  const bez=mock?34:0, W=1194+2*bez, H=834+2*bez, m=mock?28:0;
  let s=Math.min((innerWidth-2*m)/W,(innerHeight-2*m)/H);
  if(mock) s=Math.min(s,1);
  sz.style.width=W*s+'px'; sz.style.height=H*s+'px'; dev.style.transform='scale('+s+')';
  document.getElementById('rotate').style.display = (coarse && innerHeight>innerWidth) ? 'flex' : 'none';
}
function tick(){ const e=document.getElementById('clk'); if(e) e.textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
addEventListener('resize',fit); addEventListener('orientationchange',fit);
fit(); tick(); setInterval(tick,30000);

/* refresh feed while idle on home */
setInterval(async()=>{ if(S.view==='home'&&S.who){ await refreshFeed(); if(S.view==='home') render(); } },60000);

(async function(){ if(C.TEST_SKIP&&DEMO&&!S.who){ S.who=((C.STAFF||[])[0]||{}).name||'Adam'; S.view='home'; } if(S.who){ await refreshFeed(); } render(); })();
})();
</script>
