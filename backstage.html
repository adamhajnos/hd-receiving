<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>HD Backstage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#15120F; --panel:#201B16; --line:rgba(244,236,220,.14); --fg:#F4ECDC; --muted:#B9AE9A;
  --ok:#7FC4A8; --ok-bg:rgba(127,196,168,.14);
  --warn:#EBC85A; --warn-bg:rgba(235,200,90,.14);
  --bad:#E8715E; --bad-bg:rgba(232,113,94,.14);
  --display:'Archivo',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#0d0b09;color:var(--fg);font-family:var(--display);font-size:18px;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#sizer{position:relative}
#device{position:absolute;left:0;top:0;transform-origin:0 0}
#screen{position:relative;width:1194px;height:834px;overflow:hidden;background:var(--bg)}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:20px 28px 28px}
/* device mockup (desktop only) */
#device.mock{padding:34px;border-radius:58px;background:linear-gradient(145deg,#3a3631,#161412 40%,#0a0908);
  box-shadow:0 0 0 2px #4a453e,0 0 0 3px #0a0908,0 40px 90px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.06)}
#device.mock #screen{border-radius:26px;box-shadow:0 0 0 2px #000}
#device.mock #scroll{top:30px}
#device.mock::before{content:"";position:absolute;top:13px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b3a4a,#06080a 70%)}
#device.mock::after{content:"";position:absolute;top:-4px;right:90px;width:46px;height:4px;border-radius:3px 3px 0 0;background:#2a2622}
.sb{display:none;position:absolute;top:0;left:0;right:0;height:30px;padding:0 26px;align-items:center;justify-content:space-between;font:600 13px var(--display);color:var(--fg);z-index:5;background:var(--bg);pointer-events:none}
#device.mock .sb{display:flex}
.bat{display:inline-block;width:25px;height:12px;border:1.5px solid var(--muted);border-radius:4px;position:relative;margin-left:6px;vertical-align:-2px}
.bat::before{content:"";position:absolute;inset:1.5px;background:var(--fg);border-radius:1.5px}
.bat::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--muted);border-radius:0 1px 1px 0}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:#0d0b09;color:var(--fg);align-items:center;justify-content:center;text-align:center;font:800 26px var(--display);padding:40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}
h1 small{display:block;font:500 14px var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:2px}
h2{margin:0;font-size:26px;font-weight:800}
.who{display:flex;align-items:center;gap:10px}
.chip{font:500 16px var(--mono);padding:0 16px;min-height:56px;display:flex;align-items:center;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.btn{min-height:56px;padding:0 24px;border-radius:14px;border:0;font-weight:800;background:var(--fg);color:var(--bg)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg);font-weight:700}
.btn.go{background:var(--ok);color:#0c1a14}
.btn.warn{background:var(--warn);color:#1d1604}
.btn:disabled{opacity:.35;cursor:default}
.hint{margin:0;color:var(--muted);font-size:16px}
.banner{font:500 15px var(--mono);border-radius:10px;padding:10px 14px;color:var(--bad);background:var(--bad-bg)}
.banner.demo{color:var(--warn);background:var(--warn-bg)}
/* sign-in */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.name{min-height:96px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-size:24px;font-weight:800}
.name:active{background:var(--fg);color:var(--bg)}
/* PIN login */
.login{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:12px}
.dots{display:flex;gap:18px;min-height:28px}
.dots i{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--fg);border-color:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,104px);gap:14px}
.pad button{height:88px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font:500 34px var(--mono)}
.pad button:active{background:var(--fg);color:var(--bg)}
.pad .fn{font:700 18px var(--display);color:var(--muted);border-color:transparent;background:none}
/* home tiles */
.tiles .tile{min-height:92px;padding:14px 18px}
.tile.pill{min-height:64px;min-width:230px;padding:8px 18px;gap:2px;justify-content:center}.tile.pill .t{font-size:24px}.tile.pill .s{font-size:14px}.lnk{background:none;border:0;padding:6px 0;font:inherit;color:var(--fg);text-decoration:underline;min-height:44px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}.col{display:flex;flex-direction:column;gap:10px;min-width:0}.col .tile{min-height:108px;padding:14px 18px}.col .tile .t{font-size:21px}.cat{margin:6px 0 2px;font:600 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:150px;padding:18px 20px;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.tile .t{font-weight:800;font-size:24px;line-height:1.15}
.tile .s{font:500 15px var(--mono);color:var(--muted)}
.tile.todo{border-color:var(--warn);background:var(--warn-bg)}
.tile.todo .s{color:var(--warn)}
.tile.done{border-color:var(--ok);background:var(--ok-bg)}
.tile.done .s{color:var(--ok)}
.tile.soon{border:1.5px dashed var(--line);background:none;cursor:default}
.tile.soon .t{color:var(--muted);font-weight:500}
.feed h3{margin:0 0 10px;font:500 14px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.row{display:flex;gap:14px;align-items:baseline;padding:12px 4px;border-top:1px solid var(--line)}
.row .tm{flex:none;width:92px;font:500 15px var(--mono);color:var(--muted)}
.row .wh{flex:none;width:110px;font-weight:700}
.row .sm{min-width:0}
/* forms */
.top{display:flex;align-items:center;gap:16px}
.form{display:flex;flex-direction:column;gap:18px;max-width:720px}
label{display:flex;flex-direction:column;gap:8px;font-weight:700}
label span.o{font-weight:500;color:var(--muted)}
input,textarea{font:500 22px var(--display);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:0 16px;min-height:64px;width:100%}
textarea{padding:14px 16px;min-height:140px;resize:vertical}
input.money{font:500 34px var(--mono);min-height:72px}
.pre{position:relative}
.pre b{position:absolute;left:18px;top:50%;transform:translateY(-50%);font:500 30px var(--mono);color:var(--muted)}
.pre input{padding-left:44px}
.tight{gap:18px}.tight .pair{gap:18px}.tight label{gap:7px}.tight input,.tight select{min-height:58px}.tight .fmts button{min-height:54px}.tight .btn{min-height:52px}
.rlist{display:flex;flex-direction:column;gap:10px}
.rlist.two{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.rlist.two .rrow{grid-template-columns:1fr auto auto auto;font-size:18px;padding:8px 12px;gap:10px}.rlist.two .rb{width:48px;height:48px;min-height:0;font-size:22px}
.rrow{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:18px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:21px}
.rrow.part{border-color:var(--warn)}.rrow.ok{border-color:var(--ok);background:var(--ok-bg)}.rrow.over,.rrow.bad{border-color:var(--warn);background:var(--warn-bg)}
.rprice{font:700 26px var(--mono)}.rcnt{font:600 22px var(--mono);min-width:110px;text-align:right}
.rbs{display:flex;gap:8px}.rb{min-width:56px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:none;font-size:26px;font-weight:700}
.rlast{display:flex;align-items:baseline;gap:18px;padding:12px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--ok);font-size:22px}.rlast b{font:700 30px var(--mono);color:var(--ok);margin-left:auto}
.row2{display:flex;align-items:center;gap:18px}.calc{font:600 28px var(--mono)}
select{font:500 22px var(--display);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:0 16px;min-height:64px;width:100%}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
/* opening gate */
.openbig{width:100%;min-height:380px;border-radius:24px;border:1.5px solid var(--warn);background:var(--warn-bg);font:800 72px var(--display);color:var(--warn)}
.openbig:active{background:var(--warn);color:#1d1604}
.orow{padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:12px}
.orow.d{border-color:var(--ok);background:var(--ok-bg)}
.orow.c{border-color:var(--warn);background:var(--warn-bg)}
.otop{display:flex;align-items:center;justify-content:space-between;gap:14px}
.otitle{font-weight:700;font-size:20px}
.obtns{display:flex;gap:10px;flex:none}
.ob{min-height:56px;min-width:110px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:800;font-size:18px}
.ob.d.on{background:var(--ok);color:#0c1a14;border-color:var(--ok)}
.ob.c.on{background:var(--warn);color:#1d1604;border-color:var(--warn)}
.orow input{min-height:56px;font-size:20px}
.orow .pre input{font:500 26px var(--mono);padding-left:40px}
.orow .pre b{font-size:24px}
.fmts{display:flex;gap:10px;flex-wrap:wrap}
.fmts button{min-height:56px;padding:0 24px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:700;font-size:19px}
.fmts button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.npop{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50}.npop .card{width:760px;max-width:92%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 38px;display:flex;flex-direction:column;gap:18px}.npop .nl{display:block;font:500 15px var(--mono);opacity:.7;margin-bottom:6px}.npop .tx{font-size:30px;font-weight:700;line-height:1.3;white-space:pre-wrap}
.note{padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:700}
.note .nl{display:block;font:500 13px var(--mono);letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.iimg{width:160px;height:120px;object-fit:cover;border-radius:12px;display:block}
.tile{min-height:130px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.hero .tile{min-height:120px;border-width:1.5px}
.hero .tile .t{font-size:34px}
.hero .tile .s{font-size:16px}
div.tile.done{cursor:default}
/* trove list */
.findbar{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--mut,inherit);font-size:21px;text-align:left;margin:0 0 12px}.findbar b{opacity:.7;font-size:24px}
.xbtn{min-width:56px;min-height:56px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:26px;line-height:1}
.fgrp{font:600 15px var(--mono);letter-spacing:.08em;opacity:.8;margin:14px 0 8px}
.fres{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center;padding:14px 18px 14px 22px;border:1px solid var(--line);border-left:10px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px}
.fres.in{border-left-color:var(--ok)}.fres.out{border-left-color:var(--warn)}.fres.ord{border-left-color:#7aa7ff}
.fres .nm{font-size:23px}.fres .pr{font:700 26px var(--mono)}
.fres .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fres .stk{font:800 19px var(--mono);padding:8px 16px;border-radius:12px;letter-spacing:.03em}
.fres.in .stk{background:var(--ok);color:#06150e}.fres.out .stk{background:var(--warn);color:#1b1100}.fres.ord .stk{background:#7aa7ff;color:#08142b}
.fres .gn{font:800 19px var(--mono);padding:8px 16px;border-radius:999px;border:2px solid var(--fg);text-transform:uppercase;letter-spacing:.04em}
.fres .wh{font-size:18px;opacity:.8;flex:1}
.fres .rq{min-height:52px;padding:0 22px}
.tbar{display:flex;gap:12px;align-items:center}
.tbar input{flex:1}
.tchip{min-height:64px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:700;font-size:18px;white-space:nowrap}
.tchip.on{background:var(--fg);color:var(--bg)}
.tloc{margin:18px 0 8px;font:500 14px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.trow{display:flex;align-items:center;gap:16px;width:100%;min-height:68px;padding:10px 16px;margin-bottom:8px;text-align:left;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.trow .box{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:20px;color:#0c1a14}
.trow.on{border-color:var(--ok);background:var(--ok-bg)}
.trow.on .box{background:var(--ok);border-color:var(--ok)}
.cov{flex:none;width:56px;height:56px;border-radius:8px;object-fit:cover;background:#2a241d}
.cov.ph{display:flex;align-items:center;justify-content:center;font:700 17px var(--mono);color:var(--muted);letter-spacing:.04em}
.trow .tx{flex:1;min-width:0}
.trow .pr{flex:none;font:500 24px var(--mono);color:var(--fg)}
.trow b{display:block;font-size:19px}
.trow b+span{display:block;color:var(--muted);font-size:16px}
.tpanel{display:flex;align-items:center;gap:18px;padding:14px 20px;margin:10px 0 6px;border-radius:16px;border:2px solid var(--line);background:var(--panel);min-height:96px}
.tpanel .big{flex:1;min-width:0;font-size:26px}.tpanel .big small{display:block;font:600 14px var(--mono);letter-spacing:.08em;opacity:.75;text-transform:uppercase;margin-bottom:4px}
.tpanel .big span{display:block;font-size:18px;opacity:.8}
.tpanel.ok{border-color:var(--ok);background:var(--ok-bg)}.tpanel.bad{border-color:#ff5a4d;background:rgba(255,90,77,.18);animation:flash .5s 2}.tpanel.dup{border-color:var(--warn)}
@keyframes flash{50%{background:rgba(255,90,77,.55)}}
.tpanel .btn{min-height:56px}
.tact{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 12px}
.tact .btn{min-height:84px;font-size:21px;line-height:1.25;text-align:left;padding:12px 22px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.tact .btn small{font:500 15px var(--sans,inherit);opacity:.8}
.trow.ro{cursor:default}.trow.ro .gpill{flex:none;font:700 14px var(--mono);padding:5px 12px;border-radius:999px;border:1.5px solid var(--fg);text-transform:uppercase}
.stickybar{position:sticky;bottom:-28px;margin:16px -28px -28px;padding:14px 28px 28px;background:linear-gradient(transparent,var(--bg) 30%)}
/* checklist */
.steps{display:flex;flex-direction:column;gap:10px;max-width:720px}
.step{display:flex;align-items:center;gap:16px;min-height:72px;padding:12px 18px;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:20px;width:100%}
.box{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:22px;color:#0c1a14}
.step.on{border-color:var(--ok);background:var(--ok-bg)}
.step.on .box{background:var(--ok);border-color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;max-width:720px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ok);color:#0c1a14;font-weight:800;padding:16px 28px;border-radius:14px;z-index:10}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.radded{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.06);font-size:18px}.radded .btn{min-height:40px;padding:0 16px;font-size:15px}
</style>
</head>

<script>
(function(){
const C = window.HD_CONFIG;
const DEMO = !C.API_URL;
const LS = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const today = ()=> new Date().toLocaleDateString('en-CA');
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = iso=> new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});

const S = {
  view:'home', who:null, pin:'', entry:'', feed:[], err:'', busy:false,
  rfmt:'Vinyl', ritems:[], rc:{}, atype:null, aprint:true, rorder:null, rpend:null, rscan:{}, rbad:{}, rlast:null, rpack:null, rnopack:false, alisted:{}, flow:'opening', fq:'', notePop:false, note:null, itype:null, iphoto:null, check:[], open:{}, confirm:false, troveList:[], tfound:{}, tq:'', tonly:false, tload:false
};
// restore shift
(function(){
  const sh = LS.get('hd.shift',null);
  if(sh && sh.pin && Date.now()-sh.start < C.SHIFT_HOURS*3600*1000){ S.who = sh.who; S.pin = sh.pin; }
})();
if(!S.who) S.view='login';

/* ---------- data layer ---------- */
async function api(action, payload){
  if(DEMO){
    const log = LS.get('hd.demo',[]);
    if(action==='login'){
      const m=(C.STAFF||[]).find(s=>s.pin===payload.pin);
      if(!m) throw new Error('Wrong PIN'); return {ok:true,name:m.name};
    }
    if(action==='trove') return {ok:true, items:C.DEMO_TROVE||[]};
    if(action==='log'){
      const dd=Object.assign({},payload.data); if(dd.photo) dd.photo='(photo)';
      log.push({ts:new Date().toISOString(), date:today(), who:S.who, task:payload.task, summary:payload.summary, data:dd});
      LS.set('hd.demo',log); return {ok:true};
    }
    if(action==='today'){
      const notes=log.filter(e=>e.task==='note'&&Date.now()-new Date(e.ts)<36*3600*1000), n=notes[notes.length-1];
      return {ok:true, entries:log.filter(e=>e.date===today()).map(({ts,who,task,summary})=>({ts,who,task,summary})), note:n?{ts:n.ts,who:n.who,text:n.summary}:null};
    }
    return {ok:true};
  }
  const res = await fetch(C.API_URL,{method:'POST',body:JSON.stringify(Object.assign({pin:payload&&payload.pin||S.pin,action},payload||{}))});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||'Server error');
  return j;
}
async function refreshFeed(){
  try{ const j = await api('today'); S.feed=j.entries||[]; S.note=j.note||null; S.err=''; }
  catch(e){ if(/PIN/.test(e.message)){ logout(); return; } S.err='Can’t reach the server. Check the wifi and try again.'; }
}

/* ---------- views ---------- */
function bannerHTML(){
  let h='';
  
  if(S.err) h+='<div class="banner" role="alert">'+esc(S.err)+'</div>';
  return h;
}
function headerHTML(right){

}
function latest(task){ const a=S.feed.filter(e=>e.task===task); return a[a.length-1]; }

function vLogin(){
  const dots=[0,1,2,3].map(i=>'<i class="'+(i<S.entry.length?'f':'')+'"></i>').join('');
  const keys=['1','2','3','4','5','6','7','8','9'].map(k=>'<button data-act="key" data-k="'+k+'" aria-label="'+k+'">'+k+'</button>').join('');

  return '<header><h1>HD Backstage</h1></header>'+bannerHTML()+
  '<div class="login"><h2>Enter your PIN</h2><div class="dots" aria-hidden="true">'+dots+'</div>'+
  '<div class="pad">'+keys+'<button class="fn" data-act="clear">Clear</button><button data-act="key" data-k="0" aria-label="0">0</button><button class="fn" data-act="back" aria-label="Delete">\u232b</button></div>'+demo+'</div>';
}
function notePopHTML(){

}
function noteHTML(){
  return S.note ? '<div class="note"><span class="nl">Note from '+esc(S.note.who)+' \u00b7 '+fmtTime(S.note.ts)+'</span>'+esc(S.note.text)+'</div>' : '';
}
function vHome(){
  const opened = S.feed.some(e=>e.task==='opening');
  const feed = S.feed.filter(e=>e.task!=='note').slice().reverse().map(e=>
    '<div class="row"><span class="tm">'+fmtTime(e.ts)+'</span><span class="wh">'+esc(e.who)+'</span><span class="sm">'+esc(e.summary)+'</span></div>').join('');
  if(!opened){
    const started = Object.keys(LS.get('hd.open.'+today(),{})).length;
    return headerHTML()+bannerHTML()+noteHTML()+'<button class="openbig" data-act="go:opening">'+(started?'Continue opening':'Open')+'</button>';
  }
  const tile=(act,t,s)=>'<button class="tile" data-act="'+act+'"><span class="t">'+t+'</span><span class="s">'+(s||'\u00a0')+'</span></button>';
  const soon=(t)=>'<div class="tile soon" aria-disabled="true"><span class="t">'+t+'</span><span class="s">Soon</span></div>';
  const dr=S.feed.filter(e=>e.task==='dropoff').length, cl=latest('closing'), op=latest('opening');
  const openTile='<div class="tile pill done" aria-label="Opening done"><span class="t">Open</span><span class="s">Done \u00b7 '+fmtTime(op.ts)+'</span></div>';
  const closeTile=cl
    ? '<button class="tile pill done" data-act="go:closing"><span class="t">Close</span><span class="s">Done \u00b7 '+fmtTime(cl.ts)+'</span></button>'
    : '<button class="tile pill todo" data-act="go:closing"><span class="t">Close</span><span class="s">Not done</span></button>';
  const cat=(n,body)=>'<div class="col"><h3 class="cat">'+n+'</h3>'+body+'</div>';
  return headerHTML(openTile+closeTile)+bannerHTML()+noteHTML()+'<button class="findbar" data-act="go:find"><b>\u2315</b> Find a record</button><div class="cols">'+
    cat('Records',tile('go:trove','Trove records','View the list \u00b7 check the shelf')+tile('go:addrecord','Add a record','')+tile('go:receive','Receive records','')+soon('Print labels'))+
    cat('Beer',soon('Change keg')+soon('Receive keg')+soon('Menu screen'))+
    cat('Customers',tile('go:dropoff','Customer drop-off',dr?dr+' today':'')+tile('go:request','Customer request',''))+
    cat('Shop',tile('go:note','Note for next shift','')+tile('go:issue','Report an issue',''))+'</div>';
}
function topHTML(t,act,right){ return '<div class="top"><button class="btn ghost" data-act="'+(act||'home')+'">\u2039 Back</button><h2>'+t+'</h2>'+(right||'')+'<button class="lnk" data-act="home" style="margin-left:auto;font-size:18px;font-weight:700;opacity:.85">HD Backstage</button></div>'; }

const K=()=>'hd.'+(S.flow==='closing'?'close':'open')+'.'+today();
const KT=()=>'hd.trove.'+(S.tstand?'s':S.flow==='closing'?'c':'o')+'.'+today();
function steps_(){ return (S.flow==='closing'?C.CLOSING:C.OPENING).map(s=>typeof s==='string'?{t:s}:s); }
function validAmt(v){ return /^\d+(\.\d{0,2})?$/.test(String(v||'').trim()); }
function resolved_(i){
  const st=S.open[i], s=steps_()[i]; if(!st) return false;
  if(st.s==='done') return s.amount ? validAmt(st.amount) : true;
  if(st.s==='cant') return !!(st.reason||'').trim();
  return false;
}
const tkey=i=>i.artist+'|'+i.title;
const initials=i=>(String(i.artist||i.title||'?').replace(/^the\s+/i,'').trim().slice(0,2)).toUpperCase();
const COVKEY='hd.covers';
let COV=LS.get(COVKEY,{});
const covKey=i=>(i.artist+'|'+i.title).toLowerCase();
function covHTML(i){
  const u=i.cover||COV[covKey(i)];
  return u ? '<img class="cov" loading="lazy" alt="" src="'+esc(u)+'" data-ph="'+esc(initials(i))+'">' : '<div class="cov ph" data-k="'+esc(covKey(i))+'" data-a="'+esc(i.artist)+'" data-t="'+esc(i.title)+'">'+esc(initials(i))+'</div>';
}
// Cover art: looked up from Apple's free search (no key) when a row scrolls into view, then remembered on this device.
let _covQ=[], _covBusy=false, _covIO=null, _covStop=0;
function covClean(t){ return String(t||'').replace(/\([^)]*\)/g,' ').replace(/\b(S\/T|ST|OGST|7"|45|EP)\b/gi,' ').replace(/[^\w\s&'.-]/g,' ').replace(/\s+/g,' ').trim(); }
async function covFetch(el){
  const k=el.dataset.k; if(k in COV) return;
  const a=covClean(el.dataset.a).replace(/^\*?45\*?\s*/,''), t=covClean(el.dataset.t);
  try{
    const r=await fetch('https://itunes.apple.com/search?media=music&entity=album&limit=5&term='+encodeURIComponent((a+' '+t).trim()));
    if(!r.ok) throw new Error(r.status);
    const j=await r.json(), w=a.toLowerCase().split(' ')[0].replace(/^the$/,'');
    const hit=(j.results||[]).find(x=>(x.artistName||'').toLowerCase().includes(w)&&(!t||(x.collectionName||'').toLowerCase().includes(t.toLowerCase().split(' ')[0])));
    COV[k]=hit?hit.artworkUrl100.replace('100x100bb','200x200bb'):'';
    LS.set(COVKEY,COV);
    if(COV[k]) document.querySelectorAll('.cov.ph').forEach(n=>{ if(n.dataset.k===k){ const im=document.createElement('img'); im.className='cov'; im.alt=''; im.src=COV[k]; im.dataset.ph=n.textContent; n.replaceWith(im); } });
  }catch(e){ _covStop=Date.now()+60000; }
}
async function covPump(){
  if(_covBusy) return; _covBusy=true;
  while(_covQ.length){
    if(Date.now()<_covStop){ await new Promise(r=>setTimeout(r,5000)); continue; }
    const el=_covQ.shift(); if(el.isConnected) await covFetch(el);
    await new Promise(r=>setTimeout(r,450));
  }
  _covBusy=false;
}
function coverScan(){
  if(!window.IntersectionObserver) return;
  _covIO=_covIO||new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ _covIO.unobserve(e.target); if(!(e.target.dataset.k in COV)) { _covQ.push(e.target); covPump(); } } }),{rootMargin:'200px'});
  document.querySelectorAll('.cov.ph[data-k]').forEach(n=>_covIO.observe(n));
}
function priceFmt(p){
  if(p==null||String(p).trim()==='') return '';
  const n=parseFloat(String(p).replace(/[$,]/g,''));
  if(isNaN(n)) return esc(p);
  return '$'+(Number.isInteger(n)?n:n.toFixed(2));
}
// A cover that fails to load (offline, bad URL, blocked) falls back to initials.
document.addEventListener('error',ev=>{
  const t=ev.target; if(t&&t.tagName==='IMG'&&t.classList.contains('cov')){
    const d=document.createElement('div'); d.className='cov ph'; d.textContent=t.dataset.ph||'?'; t.replaceWith(d);
  }
},true);
function troveListHTML(){
  const q=S.tq.trim().toLowerCase();
  let L=S.troveList.filter(i=>!q||(i.artist+' '+i.title+' '+i.location).toLowerCase().includes(q));
  if(S.tonly) L=L.filter(i=>!S.tfound[tkey(i)]);
  if(!L.length) return '<p class="hint" style="margin-top:20px">'+(S.tload?'Loading\u2026':'Nothing here.')+'</p>';
  let out='', loc=null;
  L.forEach(i=>{
    if(i.location!==loc){ loc=i.location; out+='<div class="tloc">'+esc(loc||'No location')+'</div>'; }
    const on=!!S.tfound[tkey(i)];
    out+='<button class="trow '+(on?'on':'')+'" role="checkbox" aria-checked="'+on+'" data-act="tfound" data-k="'+esc(tkey(i))+'"><span class="box">'+(on?'\u2713':'')+'</span>'+covHTML(i)+'<span class="tx"><b>'+esc(i.title)+'</b><span>'+esc(i.artist)+'</span></span><span class="pr">'+priceFmt(i.price)+'</span></button>';
  });
  return out;
}
function troveSorted(){ return (S.troveList||[]).slice(); }  // shelf order = sheet order
function troveNext(){ return troveSorted().find(i=>!S.tfound[tkey(i)]); }
let _ac=null;
function beep(kind){
  try{
    _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended') _ac.resume();
    const seq = kind==='ok' ? [[880,.09,'sine']] : kind==='dup' ? [[520,.09,'sine'],[520,.09,'sine']] : [[200,.2,'square'],[200,.2,'square'],[200,.2,'square']];
    let t=_ac.currentTime; seq.forEach(([f,d,w])=>{ const o=_ac.createOscillator(), g=_ac.createGain(); o.type=w; o.frequency.value=f; g.gain.value=.25; o.connect(g); g.connect(_ac.destination); o.start(t); o.stop(t+d); t+=d+.07; });
  }catch(e){}
}
function tpanelHTML(){
  const nx=troveNext(), m=S.tmsg;
  if(!S.tscan) return '<div class="tpanel" id="tpanel"><div class="big"><small>Scanner</small>Tap Start, then scan each record in shelf order.</div><button class="btn go" data-act="tstart">Start scanning</button></div>';
  const nxt = nx ? '<span>Next: <b>'+esc(nx.artist)+' \u00b7 '+esc(nx.title)+'</b> ('+esc(nx.location||'')+')</span>' : '<span>Everything is scanned.</span>';
  if(!m) return '<div class="tpanel" id="tpanel"><div class="big"><small>Ready</small>Scan the first record'+nxt+'</div><button class="btn ghost" data-act="ttest">Test sound</button></div>';
  return '<div class="tpanel '+m.k+'" id="tpanel"><div class="big"><small>'+esc(m.h)+'</small>'+esc(m.t)+nxt+'</div>'+(m.k==='bad'?'<button class="btn ghost" data-act="tdismiss">OK</button>':'<button class="btn ghost" data-act="ttest">Test sound</button>')+'</div>';
}
function troveScan(code){
  code=String(code||'').trim(); if(code.length<3) return;
  const it=(S.troveList||[]).find(i=>String(i.code||'').toLowerCase()===code.toLowerCase());
  if(!it){ S.tmsg={k:'bad',h:'Not a Trove barcode',t:code}; beep('bad'); }
  else if(S.tfound[tkey(it)]){ S.tmsg={k:'dup',h:'Already scanned',t:it.artist+' \u00b7 '+it.title}; beep('dup'); }
  else{
    const nx=troveNext(), inOrder=nx&&tkey(nx)===tkey(it);
    S.tfound[tkey(it)]=true; LS.set(KT(),S.tfound);
    if(inOrder){ S.tmsg={k:'ok',h:'\u2713 Checked',t:it.artist+' \u00b7 '+it.title}; beep('ok'); }
    else{ S.tbad=S.tbad||{}; S.tbad[tkey(it)]=1; S.tmsg={k:'bad',h:'OUT OF ORDER',t:it.artist+' \u00b7 '+it.title+' is out of place. Expected: '+nx.artist+' \u00b7 '+nx.title}; beep('bad'); }
  }
  refreshTrove();
}
function tbrowseListHTML(){
  const q=(S.tbq||'').trim().toLowerCase().split(/\s+/).filter(Boolean), src=S.tseg==='back'?(C.DEMO_BACKFILL||[]):(S.troveList||[]);

  if(!L.length) return '<p class="hint" style="margin-top:20px">'+(S.tload?'Loading\u2026':'Nothing found.')+'</p>';
  const cnt={}; L.forEach(i=>cnt[i.location]=(cnt[i.location]||0)+1);
  let out='', loc=null;
  L.forEach(i=>{
    if(i.location!==loc){ loc=i.location; out+='<div class="tloc">'+esc(loc||'No location')+' \u00b7 '+cnt[loc]+'</div>'; }
    out+='<div class="trow ro">'+covHTML(i)+'<span class="tx"><b>'+esc(i.title)+'</b><span>'+esc(i.artist)+'</span></span>'+(i.genre?'<span class="gpill">'+esc(i.genre)+'</span>':'')+'<span class="pr">'+priceFmt(i.price)+'</span></div>';
  });
  return out;
}
function vTBrowse(){
  const nf=(S.troveList||[]).length, nb=(C.DEMO_BACKFILL||[]).length, seg=(k,t)=>'<button class="tchip '+(S.tseg===k?'on':'')+'" data-act="tseg" data-v="'+k+'">'+t+'</button>';
  return topHTML('Trove records','home')+bannerHTML()+

  '<div class="tbar"><input id="tbq" placeholder="Search artist, title, genre or shelf" autocomplete="off" value="'+esc(S.tbq||'')+'">'+seg('floor','On the floor ('+nf+')')+seg('back','Backfill ('+nb+')')+'</div>'+
  '<div id="tblist">'+tbrowseListHTML()+'</div>';

function troveCounts(){ const n=S.troveList.length, f=S.troveList.filter(i=>S.tfound[tkey(i)]).length; return {n,f,nf:n-f}; }
function troveDoneLabel(){ const c=troveCounts(); return c.nf?'Done ('+c.nf+' not found)':'Done'; }
function vTrove(){
  const c=troveCounts();
  return topHTML('Trove','oback','<span class="chip" id="tcount" style="margin-left:auto">'+c.f+' / '+c.n+'</span>')+bannerHTML()+
  tpanelHTML()+'<div class="tbar"><input id="tq" placeholder="Search" autocomplete="off" value="'+esc(S.tq)+'"><button class="tchip '+(S.tonly?'on':'')+'" data-act="tonly">Not found</button></div>'+

  '<div class="stickybar"><button class="btn go" id="tdone" data-act="trovedone">'+troveDoneLabel()+'</button></div>';

function findResults(){
  const q=(S.fq||'').trim().toLowerCase().split(/\s+/).filter(Boolean);

function scanUPC(raw){
  const o=rOrder(); const u=nz(raw); if(!o||!u) return;
  const map=LS.get('hd.upcmap',{});
  let l=o.lines.find(x=>!x.nobar&&nz(x.upc)===u);
  if(!l&&map[u]) l=o.lines.find(x=>x.upc===map[u]);
  if(l){ S.rscan[l.upc]=(S.rscan[l.upc]||0)+1; S.rlast=l.upc; }
  else if(o.lines.some(x=>x.nobar)){ S.rpend=u; render(); return; }
  else { S.rbad[u]=(S.rbad[u]||0)+1; S.rlast=null; }
  rSave(); render(); focusScan();
}

const MONEY=/^\d{1,7}(\.\d{1,2})?$/;
function bindForms(){
  const sub=document.getElementById('sub'); if(!sub) return;
  const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
  const check=()=>{
    let ok=false;
    if(S.view==='cash') ok = MONEY.test(val('drawer')) && MONEY.test(val('deposit'));
    if(S.view==='note') ok = !!val('nt');
    if(S.view==='issue') ok = !!S.itype && (!!val('idet') || !!S.iphoto);
    if(S.view==='addrec'){
      const pr=v=>/^\d{1,5}(\.\d{1,2})?$/.test(v)&&parseFloat(v)>0;
      ok = !!S.atype && !!val('aartist') && !!val('aalbum') && !!val('agenre');
      if(S.atype==='New'){ ok = ok && !!val('abar') && !!msrpPrice(val('amsrp')); const p=msrpPrice(val('amsrp')); const c=document.getElementById('acalc'); if(c) c.textContent = p?'Price: $'+p:'Price: enter the MSRP'; }
      if(S.atype==='Used') ok = ok && pr(val('aprice'));
      if(S.atype==='Trove') ok = ok && pr(val('aprice')) && !!val('aloc');
    }
    if(S.view==='request'){
      const who=!!val('rname') && !!(val('rphone')||val('remail')), cur=!!val('rartist') && !!val('ralbum');
      ok = who && (cur || S.ritems.length>0);
      const add=document.getElementById('radd'); if(add) add.disabled = !(who&&cur);
      sub.textContent = 'Send'+((S.ritems.length+(cur?1:0))>1?' '+(S.ritems.length+(cur?1:0))+' requests':'');
    }
    if(S.view==='drop') ok = !!val('cname') && !!val('citems') && !!(val('cphone')||val('cemail'));
    sub.disabled = !ok || S.busy;
  };
  document.querySelectorAll('input,textarea,select').forEach(e=>e.addEventListener('input',check));
  S.recheck=check;
  check();
}

  const i=+e.dataset.i; const st=S.open[i]||(S.open[i]={});
  if(e.dataset.f==='amount'){
    let v=e.value.replace(/[^\d.]/g,''); const p=v.indexOf('.');
    if(p>=0) v=v.slice(0,p+1)+v.slice(p+1).replace(/\./g,'').slice(0,2);
    if(v!==e.value) e.value=v;
    const row=e.closest('.orow'), db=row&&row.querySelector('.ob.d');
    if(db){ db.disabled=!validAmt(v); if(!validAmt(v)&&st.s==='done'){ delete st.s; row.classList.remove('d'); db.classList.remove('on'); } }
  }
  S.open[i][e.dataset.f]=e.value;
  LS.set(K(),S.open);
  const L=steps_(), left=L.filter((_,k)=>!resolved_(k)).length, f=document.getElementById('fin');
  if(f){ f.disabled=!!left||S.busy; f.textContent=left?left+' left':'Complete'; }
  const n=document.getElementById('need'); if(n) n.textContent=neededText();
});
function shrink(file,max){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('photo')); };
    img.src=url;
  });
}
document.addEventListener('change',async ev=>{
  if(!ev.target||ev.target.id!=='iphotoin'||!ev.target.files[0]) return;
  try{ S.iphoto=await shrink(ev.target.files[0],1280); }catch(e){ S.err='Couldn\u2019t read that photo. Try again.'; }
  const p=document.getElementById('iprev'); if(p) p.innerHTML=iprevHTML();
  const b=document.querySelector('[data-act=iphoto]'); if(b) b.textContent=S.iphoto?'Retake photo':'Add photo';
  if(S.recheck) S.recheck();
});
document.addEventListener('change',async ev=>{
  if(!ev.target||ev.target.id!=='packin'||!ev.target.files[0]) return;
  try{ S.rpack=await shrink(ev.target.files[0],1280); S.rnopack=false; }catch(e){ S.err='Couldn\u2019t read that photo. Try again.'; }
  render(); focusScan();
});
let _tb='', _tt=null;
document.addEventListener('keydown',ev=>{
  if(S.view==='trove' && S.tscan){
    const tg=ev.target&&ev.target.tagName; if(tg==='INPUT'||tg==='TEXTAREA') return;
    if(ev.key==='Enter'){ ev.preventDefault(); clearTimeout(_tt); const c=_tb; _tb=''; troveScan(c); return; }
    if(ev.key.length===1){ ev.preventDefault(); _tb+=ev.key; clearTimeout(_tt); _tt=setTimeout(()=>{ const c=_tb; _tb=''; if(c.length>=4) troveScan(c); },150); return; }
  }
  if(ev.key==='Enter'&&ev.target&&ev.target.id==='rscan'){ ev.preventDefault(); scanUPC(ev.target.value); return; }
  if(S.view!=='login') return;
  if(/^\d$/.test(ev.key) && S.entry.length<4){ S.entry+=ev.key; S.err=''; render(); if(S.entry.length===4) tryLogin(); }
  else if(ev.key==='Backspace'){ S.entry=S.entry.slice(0,-1); render(); }
});
document.addEventListener('click', async ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='key'){ if(S.entry.length<4){ S.entry+=b.dataset.k; S.err=''; render(); if(S.entry.length===4) tryLogin(); } }
  else if(a==='back'){ S.entry=S.entry.slice(0,-1); render(); }
  else if(a==='clear'){ S.entry=''; S.err=''; render(); }
  else if(a==='logout'){ logout(); }
  else if(a==='home'){ await refreshFeed(); S.view='home'; S.confirm=false; render(); }
  else if(a.startsWith('go:')){
    const t=a.slice(3);
    if(t==='opening'||t==='closing'){ S.flow=t; go('opening'); }
    else{ if(t==='issue'){ S.itype=null; S.iphoto=null; } if(t==='request'){ S.ritems=[]; S.rc={}; S.rfmt='Vinyl'; S.rpre=null; } if(t==='receive'){ go('recvlist'); return; }
    if(t==='trove'){ S.tbq=''; S.tseg='floor'; S.tload=!(S.troveList||[]).length; S.view='tbrowse'; render(); if(S.tload){ try{ const j=await api('trove'); S.troveList=j.items||[]; }catch(e){ S.err='Can\u2019t load the Trove list. Check the wifi and try again.'; } S.tload=false; render(); } return; }
    if(t==='addrecord'){ S.atype=null; S.alisted={}; S.aprint=true; } go({cash:'cash',dropoff:'drop',request:'request',addrecord:'addrec',note:'note',issue:'issue',find:'find'}[t]); }
  }
  else if(a==='go:trove'){}
  else if(a==='tseg'){ S.tseg=b.dataset.v; render(); }
  else if(a==='tcheck'){ S.tstand=true; S.flow='opening'; S.tfound=LS.get('hd.trove.s.'+today(),{}); S.tq=''; S.tonly=false; S.tscan=false; S.tmsg=null; S.tbad={}; S.view='trove'; render(); }
  else if(a==='otrove'){ S.tstand=false;
    S.tfound=LS.get(KT(),{}); S.tq=''; S.tonly=false; S.tscan=false; S.tmsg=null; S.tbad={}; S.view='trove'; S.tload=true; render();
    try{ const j=await api('trove'); S.troveList=j.items||[]; S.err=''; }catch(e){ S.err='Can\u2019t load the Trove list. Check the wifi and try again.'; }
    S.tload=false; render();
  }
  else if(a==='tstart'){ S.tscan=true; S.tmsg=null; beep('ok'); const q=document.getElementById('tq'); if(q) q.blur(); refreshTrove(); }
  else if(a==='ttest'){ beep('ok'); setTimeout(()=>beep('bad'),500); }
  else if(a==='tdismiss'){ S.tmsg=null; refreshTrove(); }
  else if(a==='oback'){ S.view=S.tstand?'tbrowse':'opening'; render(); }
  else if(a==='tfound'){ const k=b.dataset.k; S.tfound[k]=!S.tfound[k]; if(!S.tfound[k]) delete S.tfound[k]; LS.set(KT(),S.tfound); refreshTrove(); }
  else if(a==='tonly'){ S.tonly=!S.tonly; b.classList.toggle('on',S.tonly); refreshTrove(); }
  else if(a==='trovedone'&&S.tstand){ const miss=S.troveList.filter(i=>!S.tfound[tkey(i)]); S.tmsg=null; S.view='tbrowse'; S.err=miss.length?'Check finished. Not found: '+miss.slice(0,5).map(i=>i.artist+' - '+i.title).join('; ')+(miss.length>5?' +'+(miss.length-5)+' more':''):''; render(); }
  else if(a==='trovedone'){
    const ti=steps_().findIndex(s=>s.trove), miss=S.troveList.filter(i=>!S.tfound[tkey(i)]);
    const oo=Object.keys(S.tbad||{}).length, ooN=oo?' Out of order: '+oo+'.':'';
    S.open[ti] = miss.length ? {s:'cant',reason:'Not found: '+miss.slice(0,6).map(i=>i.artist+' - '+i.title).join('; ')+(miss.length>6?' +'+(miss.length-6)+' more':'')+'.'+ooN} : {s:'done'};
    LS.set(K(),S.open); S.view='opening'; render();
  }
  else if(a==='odone'||a==='ocant'){
    const i=+b.dataset.i, want=a==='odone'?'done':'cant', st=S.open[i]||(S.open[i]={});
    if(st.s!==want){ st.s=want; LS.set(K(),S.open); render(); }
    if(want==='cant'){ const f=document.querySelector('.oin[data-i="'+i+'"]'); if(f) f.focus(); }
  }
  else if(a==='finishopen'){
    const L=steps_(), done=[], cant=[], amounts={}, closing=S.flow==='closing';
    L.forEach((s,i)=>{ const st=S.open[i]; if(st.s==='done'){ done.push(s.t); if(s.amount) amounts[s.t]=st.amount.trim(); } else cant.push({step:s.t,reason:st.reason.trim()}); });
    const w=closing?'Closed':'Opened';
    const summary = cant.length ? w+'. Couldn\u2019t: '+cant.map(c=>c.step+' ('+c.reason+')').join('; ') : w;
    submit(closing?'closing':'opening', summary, {amounts,done,cant});
  }
  else if(a==='itype'){ S.itype=b.dataset.v; document.querySelectorAll('.fmts button').forEach(x=>x.classList.toggle('on',x===b)); if(S.recheck) S.recheck(); }
  else if(a==='iphoto'){ document.getElementById('iphotoin').click(); }
  else if(a==='iphotorm'){ S.iphoto=null; const p=document.getElementById('iprev'); if(p) p.innerHTML=iprevHTML(); if(S.recheck) S.recheck(); }
  else if(a==='noteok'){ const ack=LS.get('hd.noteack',{}); if(S.note) ack[S.who]=S.note.ts; LS.set('hd.noteack',ack); S.notePop=false; render(); try{ await api('log',{task:'noteack',summary:'Read the shift note from '+(S.note?S.note.who:''),data:{}}); }catch(e){} }
  else if(a==='savenote'){ const t=val('nt'); submit('note',t,{text:t}); }
  else if(a==='saveissue'){
    const d=val('idet');
    submit('issue','Issue: '+S.itype+(d?' - '+d:''),{type:S.itype,details:d,photo:S.iphoto?S.iphoto.split(',')[1]:''});
  }
  else if(a==='savecash'){
    submit('cash','Cash count logged',{drawer:val('drawer'),deposit:val('deposit'),note:val('note')});
  }
  else if(a==='rlist'){ S.view='recvlist'; render(); }
  else if(a==='rpick'){ S.rorder=b.dataset.id; const sv=LS.get(RK(),{}); S.rscan=sv.scan||{}; S.rbad=sv.bad||{}; S.rlast=sv.last||null; S.rnopack=!!sv.nopack; S.rpack=null; S.rpend=null; S.view='recv'; render(); focusScan(); }
  else if(a==='rplus'||a==='rminus'){ const u=b.dataset.u; S.rscan[u]=Math.max(0,(S.rscan[u]||0)+(a==='rplus'?1:-1)); if(a==='rplus') S.rlast=u; rSave(); render(); focusScan(); }
  else if(a==='rassign'){ const m=LS.get('hd.upcmap',{}); const u=b.dataset.u; m[S.rpend]=u; LS.set('hd.upcmap',m); S.rscan[u]=(S.rscan[u]||0)+1; S.rlast=u; S.rpend=null; rSave(); render(); focusScan(); }
  else if(a==='rnot'){ S.rbad[S.rpend]=(S.rbad[S.rpend]||0)+1; S.rpend=null; S.rlast=null; rSave(); render(); focusScan(); }
  else if(a==='rbaddel'){ const u=b.dataset.u; S.rbad[u]=(S.rbad[u]||0)-1; if(S.rbad[u]<=0) delete S.rbad[u]; rSave(); render(); focusScan(); }
  else if(a==='rpackbtn'){ document.getElementById('packin').click(); }
  else if(a==='rnopack'){ S.rnopack=!S.rnopack; rSave(); render(); focusScan(); }
  else if(a==='rfinish'){
    const o=rOrder(); const short=[], over=[];
    o.lines.forEach(l=>{ const g=S.rscan[l.upc]||0; if(g<l.qty) short.push(tc(l.artist)+' - '+tc(l.title)+' ('+g+' of '+l.qty+')'); if(g>l.qty) over.push(tc(l.artist)+' - '+tc(l.title)+' (+'+(g-l.qty)+')'); });
    const extra=Object.keys(S.rbad).map(u=>u+' x'+S.rbad[u]);
    const got=o.lines.reduce((n,l)=>n+Math.min(S.rscan[l.upc]||0,l.qty),0), total=o.lines.reduce((n,l)=>n+l.qty,0);
    submit('receive','Received order '+o.id+': '+got+' of '+total+' scanned'+(short.length?', '+short.length+' short':'')+(extra.length?', '+extra.length+' not on order':''),
      {order:o.id,expected:total,scanned:got,short,over,extra,packing:S.rpack?S.rpack.split(',')[1]:'',noPacking:S.rnopack}).then(ok=>{ if(ok){ LS.set(RK(),null); S.rorder=null; S.rscan={}; S.rbad={}; S.rlast=null; S.rpack=null; S.rnopack=false; } });
  }
  else if(a==='atype'){ S.atype=b.dataset.v; S.aprint=true; S.alisted={}; render(); }
  else if(a==='aprintq'){ S.aprint=!S.aprint; b.classList.toggle('on',S.aprint); b.textContent=S.aprint?'Added to print queue':'Add to print queue'; }
  else if(a==='alisted'){ const k=b.dataset.v; S.alisted[k]=!S.alisted[k]; b.classList.toggle('on',!!S.alisted[k]); }
  else if(a==='agen'){ const e=document.getElementById('abar'); if(e){ e.value='HD'+String(Date.now()).slice(-9); e.dispatchEvent(new Event('input')); } }
  else if(a==='saveaddrec'){
    const t=S.atype, price = t==='New' ? msrpPrice(val('amsrp')) : parseFloat(val('aprice'));
    const d={type:t,artist:val('aartist'),album:val('aalbum'),genre:val('agenre'),format:document.getElementById('aformat').value,price,notes:val('anotes')};
    if(t==='New'){ d.barcode=val('abar'); d.msrp=parseFloat(val('amsrp')); }
    d.printLabel = t==='Trove' ? true : t==='Used' ? S.aprint : false;
    if(t==='Trove'){ d.location=val('aloc'); d.status=d.location==='Backfill'?'Backfill':'Active'; d.listed=Object.keys(S.alisted).filter(k=>S.alisted[k]).join(', '); }
    submit('record','Added '+t+': '+d.artist+' - '+d.album+' ($'+price+')',d).then(ok=>{ if(ok){ S.atype=null; S.alisted={}; S.aprint=true; } });
  }
  else if(a==='rfmt'){ S.rfmt=b.dataset.v; document.querySelectorAll('.fmts button').forEach(x=>x.classList.toggle('on',x===b)); }
  else if(a==='fclear'){ S.fq=''; const e=document.getElementById('fq'); if(e){ e.value=''; e.focus(); } const l=document.getElementById('flist'); if(l) l.innerHTML=findHTML(); b.style.display='none'; }
  else if(a==='freq'){ const r=(S.fres||[])[+b.dataset.i]; if(r){ S.ritems=[]; S.rc={}; S.rfmt='Vinyl'; S.rpre={artist:r.a,album:r.t}; go('request'); } }
  else if(a==='radd'||a==='rdel'){
    S.rc={name:val('rname'),phone:val('rphone'),email:val('remail')}; S.rpre=null;
    if(a==='radd'){ S.ritems.push({artist:val('rartist'),album:val('ralbum'),format:S.rfmt,notes:val('rnotes')}); S.rfmt='Vinyl'; }
    else S.ritems.splice(+b.dataset.i,1);
    render(); const e=document.getElementById('rartist'); if(e) e.focus();
  }
  else if(a==='saverequest'){
    const items=S.ritems.slice();
    if(val('rartist')&&val('ralbum')) items.push({artist:val('rartist'),album:val('ralbum'),format:S.rfmt,notes:val('rnotes')});
    submit('request','Request: '+items.map(r=>r.artist+' - '+r.album).join('; '),{name:val('rname'),phone:val('rphone'),email:val('remail'),items}).then(ok=>{ if(ok){ S.ritems=[]; S.rc={}; S.rfmt='Vinyl'; S.rpre=null; } });
  }
  else if(a==='savedrop'){
    const n=val('ccount');
    submit('dropoff','Drop-off'+(n?': about '+n+' records':''),{name:val('cname'),phone:val('cphone'),email:val('cemail'),items:val('citems'),count:n});
  }
});


/* ---------- fixed iPad landscape canvas + mockup ---------- */
function fit(){
  const coarse = matchMedia('(pointer:coarse)').matches;
  const mock = C.MOCKUP==='auto' ? !coarse : !!C.MOCKUP;
  const dev=document.getElementById('device'), sz=document.getElementById('sizer');
  dev.classList.toggle('mock',mock);
  const bez=mock?34:0, W=1194+2*bez, H=834+2*bez, m=mock?28:0;
  let s=Math.min((innerWidth-2*m)/W,(innerHeight-2*m)/H);
  if(mock) s=Math.min(s,1);
  sz.style.width=W*s+'px'; sz.style.height=H*s+'px'; dev.style.transform='scale('+s+')';
  document.getElementById('rotate').style.display = (coarse && innerHeight>innerWidth) ? 'flex' : 'none';
}
function tick(){ const e=document.getElementById('clk'); if(e) e.textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
addEventListener('resize',fit); addEventListener('orientationchange',fit);
fit(); tick(); setInterval(tick,30000);
