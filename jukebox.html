<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hunky Dory Raleigh · Now on tap</title>
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap">
<style>
html,body{margin:0;height:100%;background:#110908;overflow:hidden;cursor:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;box-sizing:border-box;overflow:hidden;background:#110908;font-family:'Barlow Condensed','Arial Narrow',sans-serif;color:#1D1512}
.banner{position:absolute;left:60px;right:60px;top:20px;height:56px;display:flex;align-items:center;justify-content:center}
.banner .rule{position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-5px;background:#D2332A}
.banner .pill{position:relative;width:760px;height:56px;background:#D2332A;clip-path:polygon(26px 0,calc(100% - 26px) 0,100% 50%,calc(100% - 26px) 100%,26px 100%,0 50%)}
.banner .pill div{position:absolute;inset:4px;background:#F1DFBC;clip-path:polygon(23px 0,calc(100% - 23px) 0,100% 50%,calc(100% - 23px) 100%,23px 100%,0 50%);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
#grid{position:absolute;left:60px;right:60px;top:92px;bottom:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));grid-auto-flow:column;gap:12px 28px}
.chrome{min-height:0;box-sizing:border-box;padding:6px;border-radius:22px;background:linear-gradient(180deg,#6E6860 0%,#EDE8DF 18%,#8A847C 46%,#2A2724 58%,#AFA99F 88%,#4B4741 100%);box-shadow:0 3px 8px rgba(0,0,0,.6)}
.card{position:relative;height:100%;box-sizing:border-box;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#F4E5C4 0%,#EBD3A6 75%,#E0C28F 100%);border:4px solid #D2332A;display:flex}
.tapcol{flex:none;width:116px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#2B2623,#1B1715);border-right:3px solid #D2332A;box-shadow:inset 0 0 10px rgba(0,0,0,.85)}
.tapbtn{width:94px;height:94px;border-radius:10px;background:linear-gradient(180deg,#F6D27A 0%,#E8B04A 55%,#C98A22 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(120,70,10,.55),0 3px 0 #0B0908;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#1D1512;font-weight:800;line-height:1}
.tapbtn span:first-child{font-size:20px;letter-spacing:.14em}.tapbtn span:last-child{font-size:58px;line-height:.9}
.mid{flex-grow:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:0 20px}
.name{max-width:100%;text-align:center;line-height:1.05;font-weight:800;font-style:italic;text-transform:uppercase;white-space:nowrap}
.brew{position:relative;width:88%;height:34px;background:#D2332A;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%)}
.brew div{position:absolute;inset:3px;background:#F1DFBC;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);display:flex;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:700;white-space:nowrap}
.new{padding:0 8px;background:#D2332A;color:#F7E9CC;font-weight:800;letter-spacing:.1em;line-height:1.2}
.style{font-size:26px;line-height:1;font-weight:600;color:#54402F;white-space:nowrap}
.price{flex:none;width:160px;display:flex;align-items:center;justify-content:center;border-left:3px solid #D2332A;font-size:64px;font-weight:800;letter-spacing:-.01em}
.empty .mid{opacity:.45}.empty .name{font-size:40px}
#stale{position:absolute;right:70px;top:30px;font-size:22px;font-weight:700;color:#F1DFBC;display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="banner"><div class="rule"></div><div class="pill"><div>Hunky Dory · Now on tap</div></div></div>
  <div id="stale">offline: showing last list</div>
  <div id="grid"></div>
</div>

<script>
/* Live tap list for the shop monitor (1920x1080). Reads the same Sheet the iPads save to. */
var FEED = 'https://script.google.com/macros/s/AKfycbzlu0sZz66b8t60AaQrIfXmo_UgzG6ZApjbYo3lHthgni2bigzNPYmaro-_uH-qaRrNTA/exec?feed=taps';
var TAPS = 12, NEW_DAYS = 4, POLL_MS = 60000, CK = 'hd.jukebox.last';

function fit(){ var de = document.documentElement, w = de.clientWidth || innerWidth, h = de.clientHeight || innerHeight, s = Math.min(w/1920, h/1080), st = document.getElementById('stage');
  st.style.transform = 'scale(' + s + ')'; st.style.left = (w - 1920*s)/2 + 'px'; st.style.top = (h - 1080*s)/2 + 'px'; }

function goFull(){ var d=document.documentElement, f=d.requestFullscreen||d.webkitRequestFullscreen; if(f&&!(document.fullscreenElement||document.webkitFullscreenElement)){ try{ var p=f.call(d); if(p&&p.catch) p.catch(function(){}); }catch(e){} } }
addEventListener('keydown', function(e){ if(e.key==='Enter'||e.keyCode===13||e.keyCode===23) goFull(); });
addEventListener('click', goFull);
document.addEventListener('fullscreenchange', fit); document.addEventListener('webkitfullscreenchange', fit);
addEventListener('resize', fit); addEventListener('load', fit); fit(); [300,1500,5000].forEach(function(t){ setTimeout(fit, t); }); setInterval(fit, 10000);

function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function money(p){ var n = Number(p); return n > 0 ? '$' + n.toFixed(2) : ''; }
function pct(a){ var n = parseFloat(String(a).replace(/[^0-9.]/g, '')); return n ? n + '%' : ''; }
function isNew(t){ var ms = t ? (typeof t === 'number' ? t : Date.parse(t)) : 0; return ms > 0 && Date.now() - ms < NEW_DAYS * 864e5; }

function card(b, n){
  var num = String(n).padStart(2, '0');
  if(!b) return '<div class="chrome empty"><div class="card"><div class="tapcol"><div class="tapbtn"><span>TAP</span><span>' + num + '</span></div></div><div class="mid"><div class="name">Pouring soon</div></div></div></div>';
  var len = String(b.beer).length, size = len > 32 ? 34 : len > 24 ? 42 : 50;
  var where = esc(b.brewery) + (b.city ? ' — ' + esc(b.city) : '');
  var meta = [esc(b.style), pct(b.abv) ? pct(b.abv) + ' ABV' : ''].filter(Boolean).join('  ·  ');
  return '<div class="chrome"><div class="card"><div class="tapcol"><div class="tapbtn"><span>TAP</span><span>' + num + '</span></div></div>' +
    '<div class="mid"><div class="name" style="font-size:' + size + 'px">“' + esc(b.beer) + '”</div>' +
    '<div class="brew"><div><span>' + where + '</span>' + (isNew(b.tappedAt) ? '<span class="new">NEW</span>' : '') + '</div></div>' +
    '<div class="style">' + meta + '</div></div><div class="price">' + money(b.price) + '</div></div></div>';
}

function draw(list){
  window.__last = list;
  var by = {}; list.forEach(function(b){ by[b.tap] = b; });
  var html = ''; for(var i = 1; i <= TAPS; i++) html += card(by[i], i);
  document.getElementById('grid').innerHTML = html;
  fitText();
}
/* Long names or towns shrink until they fit their box, whichever font the screen ends up with. */
function fitText(){
  document.querySelectorAll('.name').forEach(function(el){ var f = parseFloat(el.style.fontSize) || 40; while(el.scrollWidth > el.clientWidth + 1 && f > 22){ f -= 2; el.style.fontSize = f + 'px'; } });
  document.querySelectorAll('.brew div').forEach(function(el){ var f = 24, need = function(){ var w = 56; for(var i = 0; i < el.children.length; i++) w += el.children[i].offsetWidth + (i ? 12 : 0); return w; };
    while(need() > el.clientWidth && f > 15){ f -= 1; el.style.fontSize = f + 'px'; } });
  document.querySelectorAll('.style').forEach(function(el){ var f = 26; while(el.scrollWidth > el.parentNode.clientWidth - 40 && f > 16){ f -= 1; el.style.fontSize = f + 'px'; } });
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ var g = document.getElementById('grid'); if(g.children.length) { draw(window.__last || []); } });

function load(){
  fetch(FEED, {cache: 'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    if(!j || !j.ok || !Array.isArray(j.taps)) throw new Error('bad');
    if(j.taps.length){ try{ localStorage.setItem(CK, JSON.stringify(j.taps)); }catch(e){} draw(j.taps); }
    document.getElementById('stale').style.display = 'none';
  }).catch(function(){ document.getElementById('stale').style.display = 'block'; });
}
try{ var last = JSON.parse(localStorage.getItem(CK) || 'null'); if(last) draw(last); else draw([]); }catch(e){ draw([]); }

/* Keep the screen awake: a hidden looping video plus the Wake Lock API, so the Fire Stick / monitor never drops to its screensaver. */
(function(){ var v=document.getElementById('ka');
  function play(){ try{ var p=v.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  function lock(){ try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){} }
  play(); lock(); setInterval(function(){ if(v.paused) play(); }, 15000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ play(); lock(); } });
  addEventListener('click', play); addEventListener('keydown', play); })();
load(); setInterval(load, POLL_MS);
setTimeout(function(){ location.reload(); }, 6 * 3600 * 1000); /* fresh page every few hours so a long-running screen never goes stale */
</script>
</body>
</html>
