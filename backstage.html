<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Backstage">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<title>HD Backstage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Public+Sans:wght@400;500;600;700;800&family=Special+Elite&display=swap">
<style>
:root{
  --bg:#F6F6F5; --panel:#FFFFFF; --line:rgba(20,17,13,.15); --fg:#141414; --muted:#6B6B6B; --accent:#FF6A1F;
  --ok:#2E7D5B; --ok-bg:rgba(46,125,91,.12);
  --warn:#F2B640; --warn-bg:rgba(242,182,64,.22); --warn-fg:#8A5A00;
  --bad:#C2412D; --bad-bg:rgba(194,65,45,.10);
  --display:'Public Sans',-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif; --mono:'Public Sans',-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif; --big:'Archivo Black','Arial Black',Impact,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#E8E0CF;color:var(--fg);font-family:var(--display);font-size:21px;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#sizer{position:relative}
#device{position:absolute;left:0;top:0;transform-origin:0 0}
#screen{position:relative;width:1194px;height:834px;overflow:hidden;background:var(--bg)}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:20px 28px 28px}
/* device mockup (desktop only) */
#device.mock{padding:34px;border-radius:58px;background:linear-gradient(145deg,#3a3631,#161412 40%,#0a0908);
  box-shadow:0 0 0 2px #4a453e,0 0 0 3px #0a0908,0 40px 90px rgba(0,0,0,.65),inset 0 0 0 1px rgba(20,17,13,.06)}
#device.mock #screen{border-radius:26px;box-shadow:0 0 0 2px #000}
#device.mock #scroll{top:30px}
#device.mock::before{content:"";position:absolute;top:13px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b3a4a,#06080a 70%)}
#device.mock::after{content:"";position:absolute;top:-4px;right:90px;width:46px;height:4px;border-radius:3px 3px 0 0;background:#2a2622}
.sb{display:none;position:absolute;top:0;left:0;right:0;height:30px;padding:0 26px;align-items:center;justify-content:space-between;font:600 13px var(--display);color:var(--fg);z-index:5;background:var(--bg);pointer-events:none}
#device.mock .sb{display:flex}
.bat{display:inline-block;width:25px;height:12px;border:1.5px solid var(--muted);border-radius:4px;position:relative;margin-left:6px;vertical-align:-2px}
.bat::before{content:"";position:absolute;inset:1.5px;background:var(--fg);border-radius:1.5px}
.bat::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--muted);border-radius:0 1px 1px 0}
#busy{display:none;position:absolute;inset:0;z-index:90;background:rgba(20,17,13,.35);align-items:center;justify-content:center}.bcard{background:#fff;border-radius:22px;padding:30px 44px;display:flex;flex-direction:column;align-items:center;gap:16px;min-width:300px;box-shadow:0 12px 40px rgba(0,0,0,.3)}.bmsg{font-size:26px;font-weight:700}.spin{width:56px;height:56px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--accent);animation:hdspin .8s linear infinite}.bbar{width:100%;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bbar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:4px;animation:hdbar 1.1s ease-in-out infinite}@keyframes hdspin{to{transform:rotate(360deg)}}@keyframes hdbar{0%{margin-left:-40%}100%{margin-left:100%}}#screen #scroll{bottom:40px}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--fg);align-items:center;justify-content:center;text-align:center;font:800 26px var(--display);padding:40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.app{max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font:400 24px var(--big);letter-spacing:-.01em;text-transform:uppercase}.brand{display:flex;align-items:center;gap:16px}.hdlogo{height:60px;width:auto;flex:none}
h1 small{display:block;font:500 15px var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:2px}
h2{margin:0;font:400 30px var(--big);letter-spacing:-.015em;display:flex;align-items:center;gap:12px}h2 svg{width:30px;height:30px;color:var(--accent);flex:none}
.who{display:flex;align-items:center;gap:10px}.signout{min-height:56px;padding:0 24px;border-radius:14px;border:2px solid var(--fg);background:#fff;color:var(--fg);font:700 20px var(--big,inherit);touch-action:manipulation;cursor:pointer}
.chip{font:500 20px var(--mono);padding:0 18px;min-height:62px;display:flex;align-items:center;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.btn{min-height:64px;padding:0 28px;border-radius:14px;border:0;font-weight:800;font-size:22px;background:var(--fg);color:var(--bg)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg);font-weight:700}
.btn.go{background:var(--accent);color:#14110D}
.btn.warn{background:var(--warn);color:#1d1604}
.btn:disabled{opacity:.35;cursor:default}
.hint{margin:0;color:var(--muted);font-size:20px}
.banner{font:500 18px var(--mono);border-radius:10px;padding:10px 14px;color:var(--bad);background:var(--bad-bg)}
.banner.demo{color:var(--warn-fg);background:var(--warn-bg)}
/* sign-in */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.name{min-height:96px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-size:24px;font-weight:800}
.name:active{background:var(--fg);color:var(--bg)}
/* PIN login */
.login{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:12px}
.dots{display:flex;gap:18px;min-height:28px}
.dots i{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--fg);border-color:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,104px);gap:14px}
.pad button{height:88px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font:500 34px var(--mono)}
.pad button:active{background:var(--fg);color:var(--bg)}
.pad .fn{font:700 18px var(--display);color:var(--muted);border-color:transparent;background:none}
/* home tiles */
.tiles .tile{min-height:92px;padding:14px 18px}
.tile.pill{min-height:64px;min-width:230px;padding:8px 18px;gap:2px;justify-content:center}.tile.pill .t{font-size:28px}.tile.pill .s{font-size:17px}.lnk{background:none;border:0;padding:6px 0;font:inherit;color:var(--fg);text-decoration:underline;min-height:44px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}.col{display:flex;flex-direction:column;gap:10px;min-width:0}.col .tile{min-height:118px;padding:14px 18px}.col .tile .t{font-size:26px}.cat{margin:6px 0 2px;font:800 15px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:150px;padding:18px 20px;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.tile .t{font-weight:800;font-size:28px;line-height:1.15;display:flex;align-items:center;gap:10px}.tile .t svg{flex:none;width:28px;height:28px;color:var(--accent)}.tile.done .t svg{color:var(--ok)}.tile.todo .t svg{color:var(--warn-fg)}.tile:not(.soon){box-shadow:0 1px 0 rgba(20,17,13,.04),0 8px 18px -12px rgba(20,17,13,.3)}
.tile .s{font:500 18px var(--display);line-height:1.25;color:var(--muted)}
.tile.todo{border-color:var(--warn-fg);background:var(--warn-bg)}
.tile.todo .s{color:var(--warn-fg)}
.tile.done{border-color:var(--ok);background:var(--ok-bg)}
.tile.done .s{color:var(--ok)}
.tile.soon{border:1.5px dashed var(--line);background:none;cursor:default}
.tile.soon .t{color:var(--muted);font-weight:500}
.feed h3{margin:0 0 10px;font:500 17px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.row{display:flex;gap:14px;align-items:baseline;padding:12px 4px;border-top:1px solid var(--line)}
.row .tm{flex:none;width:110px;font:500 18px var(--mono);color:var(--muted)}
.row .wh{flex:none;width:110px;font-weight:700}
.row .sm{min-width:0}
/* forms */
.top{display:flex;align-items:center;gap:16px}
.form{display:flex;flex-direction:column;gap:14px;max-width:720px}
label{display:flex;flex-direction:column;gap:6px;font-weight:700}
label span.o{font-weight:500;color:var(--muted)}
input,textarea{font:500 25px var(--display);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:0 16px;min-height:70px;width:100%}
textarea{padding:14px 16px;min-height:140px;resize:vertical}
input.money{font:500 34px var(--mono);min-height:72px}
.pre{position:relative}
.pre b{position:absolute;left:18px;top:50%;transform:translateY(-50%);font:500 30px var(--mono);color:var(--muted)}
.pre input{padding-left:44px}
.tight{gap:18px}.tight .pair{gap:18px}.tight label{gap:7px}.tight input,.tight select{min-height:58px}.tight .fmts button{min-height:54px}.tight .btn{min-height:52px}
.rlist{display:flex;flex-direction:column;gap:10px}
.rlist.two{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.rlist.two .rrow{grid-template-columns:1fr auto auto auto;font-size:18px;padding:8px 12px;gap:10px}.rlist.two .rb{width:48px;height:48px;min-height:0;font-size:22px}
.rrow{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:18px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:24px}
.rrow.part{border-color:var(--warn-fg)}.rrow.ok{border-color:var(--ok);background:var(--ok-bg)}.rrow.over,.rrow.bad{border-color:var(--warn-fg);background:var(--warn-bg)}
.rprice{font:700 26px var(--mono)}.rcnt{font:600 22px var(--mono);min-width:110px;text-align:right}
.rbs{display:flex;gap:8px}.rb{min-width:56px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:none;font-size:26px;font-weight:700}
.rlast{display:flex;align-items:baseline;gap:18px;padding:12px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--ok);font-size:22px}.rlast b{font:700 30px var(--mono);color:var(--ok);margin-left:auto}
.row2{display:flex;align-items:center;gap:18px}.calc{font:600 28px var(--mono)}
select{font:500 25px var(--display);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:0 16px;min-height:64px;width:100%}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
/* opening gate */
.openbig{width:100%;min-height:380px;border-radius:24px;border:1.5px solid var(--warn);background:var(--warn-bg);font:800 72px var(--display);color:var(--warn-fg)}
.openbig:active{background:var(--warn);color:#1d1604}
.orow{padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:12px}
.orow.d{border-color:var(--ok);background:var(--ok-bg)}
.orow.c{border-color:var(--warn-fg);background:var(--warn-bg)}
.otop{display:flex;align-items:center;justify-content:space-between;gap:14px}
.otitle{font-weight:700;font-size:26px}
.obtns{display:flex;gap:10px;flex:none}
.ob{min-height:64px;min-width:130px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:800;font-size:23px}
.ob.d.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.ob.c.on{background:var(--warn);color:#1d1604;border-color:var(--warn-fg)}
.orow input{min-height:62px;font-size:24px}
.orow .pre input{font:500 26px var(--mono);padding-left:40px}
.orow .pre b{font-size:24px}
.fmts{display:flex;gap:10px;flex-wrap:wrap}
.fmts button{min-height:62px;padding:0 26px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:700;font-size:23px}
.fmts button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.npop{position:absolute;inset:0;background:rgba(20,17,13,.5);display:flex;align-items:center;justify-content:center;z-index:50}.npop .card{width:760px;max-width:92%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 38px;display:flex;flex-direction:column;gap:18px}.npop .nl{display:block;font:500 15px var(--mono);opacity:.7;margin-bottom:6px}.npop .tx{font-size:30px;font-weight:700;line-height:1.3;white-space:pre-wrap}
.note{padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:24px;font-weight:700}
.note .nl{display:block;font:500 16px var(--mono);letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.iimg{width:160px;height:120px;object-fit:cover;border-radius:12px;display:block}
.tile{min-height:130px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.hero .tile{min-height:120px;border-width:1.5px}
.hero .tile .t{font-size:34px}
.hero .tile .s{font-size:16px}
div.tile.done{cursor:default}
/* trove list */
.findbar{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--mut,inherit);font-size:25px;text-align:left;margin:0 0 12px}.findbar svg{width:26px;height:26px;color:var(--accent)}
.xbtn{min-width:56px;min-height:56px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:26px;line-height:1}
.fgrp{font:600 15px var(--mono);letter-spacing:.08em;opacity:.8;margin:14px 0 8px}
.fres{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center;padding:14px 18px 14px 22px;border:1px solid var(--line);border-left:10px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px}
.fres.in{border-left-color:var(--ok)}.fres.out{border-left-color:var(--warn-fg)}.fres.ord{border-left-color:#7aa7ff}
.fres .nm{font-size:27px}.fres .pr{font:700 26px var(--mono)}
.fres .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fres .stk{font:800 22px var(--mono);padding:8px 16px;border-radius:12px;letter-spacing:.03em}
.fres.in .stk{background:var(--ok);color:#fff}.fres.out .stk{background:var(--warn);color:#1b1100}.fres.ord .stk{background:#7aa7ff;color:#08142b}
.fres .gn{font:800 22px var(--mono);padding:8px 16px;border-radius:999px;border:2px solid var(--fg);text-transform:uppercase;letter-spacing:.04em}
.fres .wh{font-size:21px;opacity:.8;flex:1}
.fres .rq{min-height:52px;padding:0 22px}
.tbar{display:flex;gap:12px;align-items:center}
.tbar input{flex:1}
.tchip{min-height:70px;padding:0 22px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:700;font-size:22px;white-space:nowrap}
.tchip.on{background:var(--fg);color:var(--bg)}
.tloc{position:sticky;top:-20px;z-index:3;display:flex;align-items:center;justify-content:space-between;margin:22px -8px 10px;padding:14px 18px;border-radius:12px;border-left:8px solid var(--warn);background:#FFF4D6;font:800 24px var(--display);letter-spacing:.04em;color:var(--fg);text-transform:uppercase;box-shadow:0 6px 12px rgba(20,17,13,.2)}.tloc .n{font:700 20px var(--mono);color:var(--warn-fg);letter-spacing:0}
.tcust{margin:-4px 0 14px;padding:16px 18px;border-radius:14px;background:var(--accent);color:#fff;text-align:center;font:400 34px var(--big);text-transform:uppercase;letter-spacing:.01em}
.trow{display:flex;align-items:center;gap:16px;width:100%;min-height:68px;padding:10px 16px;margin-bottom:8px;text-align:left;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.trow .box{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.trow.on{border-color:var(--ok);background:var(--ok-bg)}
.trow.on .box{background:var(--ok);border-color:var(--ok)}
.cov{flex:none;width:56px;height:56px;border-radius:8px;object-fit:cover;background:#E9E1D0}
.cov.ph{display:flex;align-items:center;justify-content:center;font:700 17px var(--mono);color:var(--muted);letter-spacing:.04em}
.trow .tx{flex:1;min-width:0}
.pqb{flex:none;min-height:52px;padding:0 18px;border-radius:12px;border:2px solid var(--fg);background:#fff;color:var(--fg);font:700 18px var(--big,inherit);touch-action:manipulation;cursor:pointer;white-space:nowrap}.pqb.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.trow .pr{flex:none;font:500 28px var(--mono);color:var(--fg)}
.trow b{display:block;font-size:25px}
.trow b+span{display:block;color:var(--muted);font-size:21px}
.tpanel{display:flex;align-items:center;gap:18px;padding:14px 20px;margin:10px 0 6px;border-radius:16px;border:2px solid var(--line);background:var(--panel);min-height:96px}
.tpanel .big{flex:1;min-width:0;font-size:30px}.tpanel .big small{display:block;font:600 17px var(--mono);letter-spacing:.08em;opacity:.75;text-transform:uppercase;margin-bottom:4px}
.tpanel .big span{display:block;font-size:22px;opacity:.8}
.tpanel.ok{border-color:var(--ok);background:var(--ok-bg)}.tpanel.bad{border-color:#ff5a4d;background:rgba(255,90,77,.18);animation:flash .5s 2}.tpanel.dup{border-color:var(--warn-fg)}
@keyframes flash{50%{background:rgba(255,90,77,.55)}}
.tpanel .btn{min-height:56px}
.addpick{display:grid;grid-template-columns:1fr;gap:14px;margin-top:8px}.addpick .btn{min-height:124px;font-size:34px;font-weight:800;text-align:left;padding:14px 26px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}.addpick .btn small{font:400 20px var(--display);opacity:.72}
.tact{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 12px}
.tact .btn{min-height:104px;font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.25;text-align:left;padding:12px 22px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.tact .btn small{font:400 18px var(--display);opacity:.72;letter-spacing:0}
.trow.ro{cursor:default}.trow.ro .gpill{flex:none;font:700 17px var(--mono);padding:5px 12px;border-radius:999px;border:1.5px solid var(--fg);text-transform:uppercase}
.trow.ro .grip{flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:32px;color:var(--muted);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border:1px solid var(--line)}
.trow.ro.drag{border-color:var(--warn-fg);background:var(--warn-bg);box-shadow:0 10px 24px rgba(20,17,13,.45);position:relative;z-index:4}
.guide{margin-top:14px;padding:24px 28px;border-radius:18px;border:1px solid var(--line);background:var(--panel)}
.guide h3{margin:0 0 18px;font:800 32px var(--display)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.steps li{display:flex;gap:20px;align-items:flex-start}
.steps .num{flex:none;width:56px;height:56px;border-radius:50%;background:var(--warn);color:#1d1604;display:flex;align-items:center;justify-content:center;font:800 30px var(--display)}
.steps b{font-size:28px}.steps p{margin:4px 0 8px;font-size:23px;color:var(--muted);line-height:1.35}.steps p+.btn{min-height:56px;font-size:20px}

<script>

  rfmt:'Vinyl', ritems:[], rc:{}, atype:null, acond:null, alast:null, aprint:true, rorder:null, rpend:null, rscan:{}, rbad:{}, rlast:null, rpack:null, rnopack:false, alisted:{}, flow:'opening', fq:'', notePop:false, note:null, itype:null, iphoto:null, check:[], open:{}, confirm:false, troveList:[], tfound:{}, tq:'', tonly:false, tload:false

(function(){
  const sh = LS.get('hd.shift',null);
  if(sh && sh.pin && Date.now()-sh.start < C.SHIFT_HOURS*3600*1000){ S.who = sh.who; S.pin = sh.pin; }
})();
if(!S.who) S.view='login';

/* ---------- data layer ---------- */
async function api(action, payload){
  if(action==='login'||action==='today'||action==='trove') return apiRaw(action,payload);
  busyOn(action==='log'&&payload&&payload.task==='feature'?'Sending…':'Saving…');
  try{ return await apiRaw(action,payload); } finally{ busyOff(); }
}
let _bt=null,_bn=0;
function busyOn(msg){ _bn++; if(_bn>1) return; clearTimeout(_bt); _bt=setTimeout(()=>{ let o=document.getElementById('busy'); if(!o){ o=document.createElement('div'); o.id='busy'; document.getElementById('screen').appendChild(o); } o.innerHTML='<div class="bcard"><div class="spin"></div><div class="bmsg">'+msg+'</div><div class="bbar"><i></i></div></div>'; o.style.display='flex'; },150); }

async function apiRaw(action, payload){
  if(DEMO){
    const log = LS.get('hd.demo',[]);

    if(action==='today'){
      const notes=log.filter(e=>e.task==='note'&&Date.now()-new Date(e.ts)<36*3600*1000), n=notes[notes.length-1];
      return {ok:true, entries:log.filter(e=>e.date===today()).map(({ts,who,task,summary})=>({ts,who,task,summary})), note:n?{ts:n.ts,who:n.who,text:n.summary}:null};
    }
    return {ok:true};
  }
  const res = await fetch(C.API_URL,{method:'POST',body:JSON.stringify(Object.assign({pin:payload&&payload.pin||S.pin,action},payload||{}))});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||'Server error');
  return j;
}

async function refreshFeed(){

}

function latest(task){ const a=S.feed.filter(e=>e.task===task); return a[a.length-1]; }

function vLogin(){
  const dots=[0,1,2,3].map(i=>'<i class="'+(i<S.entry.length?'f':'')+'"></i>').join('');
  const keys=['1','2','3','4','5','6','7','8','9'].map(k=>'<button data-act="key" data-k="'+k+'" aria-label="'+k+'">'+k+'</button>').join('');
  const demo = DEMO ? '<p class="hint" style="font-size:14px;opacity:.7">Demo PINs: '+C.STAFF.map(s=>esc(s.name)+' '+esc(s.pin)).join(' \u00b7 ')+'</p>' : '';
  return '<header><h1>HD Backstage</h1></header>'+bannerHTML()+
  '<div class="login"><h2>Enter your PIN</h2><div class="dots" aria-hidden="true">'+dots+'</div>'+
  '<div class="pad">'+keys+'<button class="fn" data-act="clear">Clear</button><button data-act="key" data-k="0" aria-label="0">0</button><button class="fn" data-act="back" aria-label="Delete">\u232b</button></div>'+demo+'</div>';
}
function notePopHTML(){
  return '<div class="npop" role="dialog" aria-modal="true" aria-label="Note from the last shift"><div class="card"><div><span class="nl">NOTE FROM '+esc(String(S.note.who).toUpperCase())+' \u00b7 '+fmtTime(S.note.ts)+'</span><div class="tx">'+esc(S.note.text)+'</div></div><div><button class="btn go" data-act="noteok">Got it</button></div></div></div>';
}
function noteHTML(){
  return S.note ? '<div class="note"><span class="nl">Note from '+esc(S.note.who)+' \u00b7 '+fmtTime(S.note.ts)+'</span>'+esc(S.note.text)+'</div>' : '';
}
function vHome(){
  const opened = !!C.TEST_SKIP || S.feed.some(e=>e.task==='opening');
  const feed = S.feed.filter(e=>e.task!=='note').slice().reverse().map(e=>
    '<div class="row"><span class="tm">'+fmtTime(e.ts)+'</span><span class="wh">'+esc(e.who)+'</span><span class="sm">'+esc(e.summary)+'</span></div>').join('');
  if(!opened){
    const started = Object.keys(LS.get('hd.open.'+today(),{})).length;
    return headerHTML()+bannerHTML()+noteHTML()+'<button class="openbig" data-act="go:opening">'+(started?'Continue opening':'Open')+'</button>';
  }
  const tile=(act,t,s,i)=>'<button class="tile" data-act="'+act+'"><span class="t">'+ic(i)+'<span>'+t+'</span></span><span class="s">'+(s||'\u00a0')+'</span></button>';
  const soon=(t,d)=>'<div class="tile soon" aria-disabled="true"><span class="t">'+t+'</span><span class="s">'+(d?d+' \u00b7 ':'')+'Soon</span></div>';
  const dr=S.feed.filter(e=>e.task==='dropoff').length, cl=latest('closing'), op=latest('opening')||{ts:new Date().toISOString()};
  const openTile='<div class="tile pill done" aria-label="Opening done"><span class="t">'+ic('sun')+'<span>Open</span></span><span class="s">Done \u00b7 '+fmtTime(op.ts)+'</span></div>';
  const closeTile=cl

function scanUPC(raw){
  const o=rOrder(); const u=nz(raw); if(!o||!u||rHeld().length) return;
  const map=LS.get('hd.upcmap',{});

  if(!l&&map[u]) l=o.lines.find(x=>x.upc===map[u]);
  if(l){ S.rscan[l.upc]=(S.rscan[l.upc]||0)+1; S.rlast=l.upc; S.rhold=rqOpenMatch(l).map(x=>x.id); (S.rhist=S.rhist||[]).push({u:l.upc}); }
  else if(o.lines.some(x=>x.nobar)){ S.rpend=u; render(); return; }
  else { S.rbad[u]=(S.rbad[u]||0)+1; S.rlast=null; (S.rhist=S.rhist||[]).push({b:u}); }
  rSave(); render(); focusScan();
}

const PQ='hd.printq', PS='hd.printstart';
const pqGet=()=>LS.get(PQ,[]);
function pqAdd(r){ const q=pqGet(); q.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),code:r.code||'',artist:r.artist||'',title:r.title||r.album||'',genre:r.genre||'',price:r.price,notes:r.notes||''}); LS.set(PQ,q); }
function labelHTML(r){
  if(!r) return '<div class="lbl blank"></div>';
  if(r.test) return '<div class="lbl tst">'+r.test+'</div>';
  const pr=(r.price===0||r.price)?'$'+Number(r.price).toLocaleString('en-US',{maximumFractionDigits:2}):'';
  return '<div class="lbl"><img class="llogo" src="'+LOGOSRC+'" alt="Hunky Dory"><div class="lt"><div class="lh"><span>'+esc(r.genre||'')+'</span></div><div class="la">'+esc(r.artist)+'</div><div class="ll">'+esc(r.title)+'</div><div class="ln">'+esc(r.notes||'')+'</div></div>'+
    '<div class="lr"><div class="lp">'+esc(pr)+'</div>'+(r.code?barSVG(r.code)+'<div class="lc">'+esc(r.code)+'</div>':'')+'</div></div>';
}
const pcal=()=>Object.assign({s:94,x:0,y:0},LS.get('hd.pcal',{}));
function pageHTML(slots){ const c=pcal(); return '<div class="ppage" style="transform-origin:0 0;transform:translate('+c.x+'in,'+c.y+'in) scale('+(c.s/100)+')">'+slots.map(labelHTML).join('')+'</div>'; }
function pcalHTML(){ const c=pcal(), b=(k,d,t)=>'<button class="btn ghost" data-act="pcal" data-k="'+k+'" data-d="'+d+'" style="min-height:52px;min-width:64px">'+t+'</button>', row=(l,k,v,st)=>'<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="flex:1;font-size:19px">'+l+'</span>'+b(k,-st,'\u2212')+'<b style="min-width:90px;text-align:center;font-size:20px">'+v+'</b>'+b(k,st,'+')+'</div>';
  return '<details class="howto" style="margin-top:14px"><summary>Printer alignment (if labels print too big or off the sticker)</summary><div style="padding-top:8px"><p class="hint" style="margin:0 0 6px">Print the test page on plain paper, hold it over a label sheet against a window, and adjust until the boxes sit on the labels.</p>'+
   row('Size','s',c.s+'%',1)+row('Move right','x',c.x.toFixed(2)+'\u2033',.02)+row('Move down','y',c.y.toFixed(2)+'\u2033',.02)+
   '<div style="display:flex;gap:10px;margin-top:10px"><button class="btn go" data-act="pptest">Print alignment test</button><button class="btn ghost" data-act="pcalreset">Reset</button></div></div></details>'; }
function sheetPages(){
  const q=pqGet(), start=Math.min(19,Math.max(0,LS.get(PS,0))); const slots=Array(start).fill(null).concat(q); const pages=[];
  for(let i=0;i<slots.length;i+=20){ const p=slots.slice(i,i+20); while(p.length<20) p.push(null); pages.push(p); }
  return pages;
}
function vLabels(){

const POUR={div:20,plus:1,step:0.5}; /* from the Keg Tracker: sixtel / 20 + $1, rounded to $0.50 */
const SIZE={'1/6':1,'1/4':1.5,'1/2':3};
function pourPrice(cost,size){ const f=SIZE[String(size||'1/6').replace(/\s*bbl.*/i,'').trim()]; if(!f||!(cost>0)) return null; const raw=cost/(POUR.div*f)+POUR.plus; return Math.floor(raw/POUR.step+0.5+1e-9)*POUR.step; }
async function kegScan(){
  const sm = window.claude&&window.claude.use ? await window.claude.use('sample') : null;
  if(!sm) throw new Error('nosample');
  const blob = await (await fetch(S.iphoto)).blob();
  const known = kegs().map(k=>k.beer+' | '+k.brewery).join('\n');
  const prompt='This is a photo of a beer distributor delivery invoice. Return ONLY JSON: {"supplier":string,"invoice":string,"kegs":[{"brewery":string,"beer":string,"size":string,"cost":number}]}. '+
   'Include only kegs being delivered: lines with a product and a price that are NOT crossed out or struck through. Exclude lines starting "Empty" (returned kegs), key deposits, deposits, totals. cost is the PRICE column, not the deposit. size like "1/6 bbl". '+
   'Product text looks like "Brewery-Beer Name 1/6 bbl" and may be cut off at the edge of the photo. If a name is cut off or abbreviated, use the matching entry from this known list (its exact beer and brewery spelling) when one clearly matches; otherwise give what is visible. Known beers (beer | brewery):\n'+known;
  const r = await sm.json(prompt,{images:[blob],modelTier:'default',cache:false});
  if(!r||!Array.isArray(r.kegs)) throw new Error('bad');
  return r;
}
async function kegAuto(){
  S.rkBusy=true; S.err=''; render();
  try{
    const r=await kegScan(); const kegsIn=r.kegs.filter(k=>k&&k.beer&&k.cost>0);
    if(!kegsIn.length) throw new Error('none');
    const L=kegs(), id=Date.now(), out=[];
    kegsIn.forEach(k=>{ const price=pourPrice(k.cost,k.size); const o={key:k.beer+'|'+k.brewery,beer:k.beer,brewery:k.brewery,style:'',price,status:'deck',tap:null,days:0,lastTap:null,supplier:r.supplier||'',scanId:id}; L.push(o); out.push({beer:k.beer,brewery:k.brewery,cost:k.cost,price}); });
    LS.set(KEGK,L);
    S.rkBusy=false; S.rkDone={id,kegs:out,supplier:r.supplier,invoice:r.invoice}; render();
    api('log',{who:S.who,task:'kegrecv',summary:'Kegs received from '+(r.supplier||'invoice')+': '+out.map(k=>k.beer+(k.price?' ('+kfmt(k.price)+')':'')).join(', '),data:{supplier:r.supplier,invoice:r.invoice,kegs:out,photo:S.iphoto.split(',')[1],auto:true}}).then(refreshFeed).catch(()=>{});
  }catch(e){
    S.rkBusy=false; S.err = e.message==='nosample' ? '' : 'Couldn’t read that invoice. Add the kegs by hand below, or retake the photo.'; render();
  }
}

const ST={RED:'#D2332A',CREAM:'#F1DFBC',INK:'#1D1512'};
const stF=(px,o)=>((o&&o.i)?'italic ':'')+((o&&o.w)||800)+' '+px+'px "Barlow Condensed","Arial Narrow",sans-serif';
const stT=px=>px+'px "Special Elite","Courier New",monospace';
let _stFonts=null;
function stReady(){ if(!_stFonts&&document.fonts&&document.fonts.load){ _stFonts=Promise.all(['italic 800 40px "Barlow Condensed"','800 40px "Barlow Condensed"','700 40px "Barlow Condensed"','40px "Special Elite"'].map(f=>document.fonts.load(f,'AaBb0123 —'))).catch(()=>{}); } return _stFonts||Promise.resolve(); }
function stCanvas(){ const c=document.createElement('canvas'); c.width=1080; c.height=1920; return c; }
function stW(x,t,tr){ if(!tr) return x.measureText(t).width; let w=0; for(const ch of t) w+=x.measureText(ch).width+tr; return w; }
function stDraw(x,t,cx,base,font,col,tr,left){ x.font=font; x.fillStyle=col; x.textAlign='left'; x.textBaseline='alphabetic';
  const w=stW(x,t,tr); let px=left?cx:cx-w/2;
  if(!tr){ x.fillText(t,px,base); return; }
  for(const ch of t){ x.fillText(ch,px,base); px+=x.measureText(ch).width+tr; } }
function stWrap(x,t,maxW){ const ws=t.split(/\s+/), L=[]; let cur=''; ws.forEach(w=>{ const n=cur?cur+' '+w:w; if(!cur||x.measureText(n).width<=maxW) cur=n; else { L.push(cur); cur=w; } }); if(cur) L.push(cur); return L; }
function stRR(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
function stHex(x,X,Y,W,H,c){ x.beginPath(); x.moveTo(X+c,Y); x.lineTo(X+W-c,Y); x.lineTo(X+W,Y+H/2); x.lineTo(X+W-c,Y+H); x.lineTo(X+c,Y+H); x.lineTo(X,Y+H/2); x.closePath(); }
function stBg(x){ x.save(); x.translate(540,921.6); x.scale(763.7,1412); const g=x.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,'#3A1912'); g.addColorStop(.55,'#1B0C09'); g.addColorStop(1,'#0F0807'); x.fillStyle=g; x.fillRect(-3,-3,6,6); x.restore(); }
function stChrome(x,X,Y,W,H,r,sh){ x.save(); if(sh){ x.shadowColor='rgba(0,0,0,.7)'; x.shadowBlur=sh[0]; x.shadowOffsetY=sh[1]; }
  const g=x.createLinearGradient(0,Y,0,Y+H); [[0,'#6E6860'],[.16,'#EDE8DF'],[.44,'#8A847C'],[.58,'#2A2724'],[.88,'#AFA99F'],[1,'#4B4741']].forEach(s=>g.addColorStop(s[0],s[1]));
  x.fillStyle=g; stRR(x,X,Y,W,H,r); x.fill(); x.restore(); }
function stLabel(x,X,Y,W,H,r,bd){ x.fillStyle=ST.RED; stRR(x,X,Y,W,H,r); x.fill();
  const ix=X+bd,iy=Y+bd,iw=W-2*bd,ih=H-2*bd; x.save(); stRR(x,ix,iy,iw,ih,Math.max(r-bd,4)); x.clip();
  x.save(); x.translate(ix+iw/2,iy+ih*.45); x.scale(iw/2*1.4142,ih*.55*1.4142); const g=x.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,'#F4E5C4'); g.addColorStop(.75,'#EBD3A6'); g.addColorStop(1,'#E0C28F'); x.fillStyle=g; x.fillRect(-2,-2,4,4); x.restore();
  return {ix,iy,iw,ih}; }
function stPanel(x,X,Y,W,H,bd,sh){ const g=x.createLinearGradient(X,0,X+W,0); g.addColorStop(0,'#2B2623'); g.addColorStop(1,'#1B1715'); x.fillStyle=g; x.fillRect(X,Y,W,H);
  const e=(x0,y0,x1,y1,rx,ry,rw,rh)=>{ const q=x.createLinearGradient(x0,y0,x1,y1); q.addColorStop(0,'rgba(0,0,0,.8)'); q.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=q; x.fillRect(rx,ry,rw,rh); };
  e(X,0,X+sh,0,X,Y,sh,H); e(X+W,0,X+W-sh,0,X+W-sh,Y,sh,H); e(0,Y,0,Y+sh,X,Y,W,sh); e(0,Y+H,0,Y+H-sh,X,Y+H-sh,W,sh);
  x.fillStyle=ST.RED; x.fillRect(X+W,Y,bd,H); }
function stKey(x,X,Y,S,r,d,hi,lo){ x.fillStyle='#0B0908'; stRR(x,X,Y+d,S,S,r); x.fill();
  const g=x.createLinearGradient(0,Y,0,Y+S); g.addColorStop(0,'#F6D27A'); g.addColorStop(.55,'#E8B04A'); g.addColorStop(1,'#C98A22'); x.fillStyle=g; stRR(x,X,Y,S,S,r); x.fill();
  x.save(); stRR(x,X,Y,S,S,r); x.clip(); x.fillStyle='rgba(255,255,255,.65)'; x.fillRect(X,Y,S,hi); x.fillStyle='rgba(120,70,10,.55)'; x.fillRect(X,Y+S-lo,S,lo); x.restore(); }
function stBanner(x,X,Y,W,H,cut,bd,text,size,o){ o=o||{}; x.fillStyle=ST.RED; stHex(x,X,Y,W,H,cut); x.fill(); x.fillStyle=ST.CREAM; stHex(x,X+bd,Y+bd,W-2*bd,H-2*bd,cut-Math.round(bd*.7)); x.fill();
  const maxW=W-2*cut-8, tr=s=>(o.track||0)*s, f=s=>stF(s,{w:o.w||700}); let s=size; x.font=f(s); while(s>20&&stW(x,text,tr(s))>maxW){ s-=2; x.font=f(s); }
  stDraw(x,text,X+W/2,Y+H/2+s*.4,f(s),ST.INK,tr(s)); }
function stHead(x,top,h,w,cut,bd,rule,text,size){ x.fillStyle=ST.RED; x.fillRect(60,top+h/2-rule/2,960,rule); stBanner(x,540-w/2,top,w,h,cut,bd,text,size,{w:800,track:.14}); }
function stBlob(c){ return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.95)); }
function stPad(n){ return String(n).padStart(2,'0'); }

async function stBeer(b){ await stReady(); const c=stCanvas(), x=c.getContext('2d'); stBg(x);
  stHead(x,300,100,700,40,6,14,'NEW ON TAP',70);
  stChrome(x,60,490,960,800,40,[30,10]); const L=stLabel(x,72,502,936,776,30,8);
  stPanel(x,L.ix,L.iy,270,L.ih,5,18);
  const kx=L.ix+19, ky=L.iy+(L.ih-232)/2; stKey(x,kx,ky,232,22,7,2,8);
  stDraw(x,'TAP',kx+116,ky+22.5+43.2,stF(48),ST.INK,6.72); stDraw(x,stPad(b.tap),kx+116,ky+74.5+127.5,stF(150),ST.INK,0);
  const tx0=L.ix+275+34, tw=L.iw-275-68, cx=tx0+tw/2;
  const name=(b.name||'').toUpperCase(), n=name.length; let ts=n>32?70:n>24?88:n>14?106:130, lines, tH, styleLines, sH;
  const style=(b.style||'').trim(), abv=b.abv?String(b.abv).replace(/[^0-9.]/g,'')+'%':'';
  for(;;){ x.font=stF(ts,{i:true}); lines=stWrap(x,'“'+name+'”',tw); if(lines.every(l=>x.measureText(l).width<=tw)||ts<=40) break; ts-=4; }
  const sf=46; x.font=stF(sf,{w:700}); const parts=[style,abv?abv+' ABV':''].filter(Boolean);
  const one=parts.reduce((a,p)=>a+x.measureText(p).width,0)+(parts.length>1?49:0);
  styleLines=!parts.length?[]:(one<=tw?[parts]:parts.map(p=>[p])); sH=styleLines.length*55.2;
  const pr=b.price?'$'+Number(b.price).toFixed(2):'';
  const total=()=>{ tH=lines.length*ts; return tH+44+84+(sH?44+sH+14:44)+(pr?125.4:0); };
  while(total()>740&&ts>40){ ts-=4; x.font=stF(ts,{i:true}); lines=stWrap(x,'“'+name+'”',tw); }
  let y=L.iy+(L.ih-total())/2;
  lines.forEach((ln,i)=>stDraw(x,ln,cx,y+i*ts+ts*.9,stF(ts,{i:true}),ST.INK,0)); y+=tH+44;
  stBanner(x,tx0,y,tw,84,32,5,b.city?b.brewery+' — '+b.city:b.brewery,40,{w:700}); y+=84+44;
  styleLines.forEach(row=>{ x.font=stF(sf,{w:700}); const ws=row.map(p=>x.measureText(p).width), tot=ws.reduce((a,v)=>a+v,0)+(row.length>1?49:0); let px=cx-tot/2;
    row.forEach((p,i)=>{ stDraw(x,p,px,y+sf,stF(sf,{w:700}),ST.INK,0,true); px+=ws[i]; if(i<row.length-1){ x.fillStyle=ST.RED; x.fillRect(px+22,y+8,5,40); px+=49; } }); y+=55.2; });
  if(sH) y+=14;
  if(pr) stDraw(x,pr,cx,y+115.5,stF(132),ST.INK,0);
  x.fillStyle=ST.CREAM; x.restore();
  stDraw(x,'NOW POURING AT',540,1370+25.5+7.5,stT(34),ST.CREAM,6.8); stDraw(x,'HUNKY DORY RECORDS · RALEIGH',540,1370+76.5+7.5,stT(34),ST.CREAM,6.8);
  x.fillStyle=ST.RED; x.fillRect(60,1616,960,14);
  return stBlob(c); }

const BCK='hd.brewcity', ARK='hd.arrivals';
function postRevoke(p){ if(!p) return; (p.urls||[]).forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} }); p.urls=[]; }
function postClose(){ postRevoke(S.post); S.post=null; render(); }
function stShare(files){
  if(!(navigator.canShare&&navigator.share&&navigator.canShare({files}))) return Promise.reject(new Error('noshare'));
  return navigator.share({files}).then(()=>true).catch(e=>(e&&e.name==='AbortError')?false:Promise.reject(e));
}
function stSetUrls(p,blobs,names){ postRevoke(p); p.files=blobs.map((b,i)=>new File([b],names[i],{type:'image/jpeg'})); p.urls=blobs.map(b=>URL.createObjectURL(b)); }

function shrink(file,max){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('photo')); };
    img.src=url;
  });
}

/* ---------- fixed iPad landscape canvas + mockup ---------- */
function fit(){
  const coarse = matchMedia('(pointer:coarse)').matches;
  /* iPad home-screen apps can report stale (portrait) sizes after launch or rotation, so trust the device orientation */
  let vw=innerWidth, vh=innerHeight;
  const portrait = (typeof window.orientation==='number') ? Math.abs(window.orientation)!==90 : vh>vw;
  if(coarse && !portrait && vh>vw){ const t=vw; vw=vh; vh=t; }
  const mock = C.MOCKUP==='auto' ? !coarse : !!C.MOCKUP;
  const dev=document.getElementById('device'), sz=document.getElementById('sizer');
  dev.classList.toggle('mock',mock);
  const bez=mock?34:0, W=1194+2*bez, H=834+2*bez, m=mock?28:0;
  let s=Math.min((vw-2*m)/W,(vh-2*m)/H);
  if(mock) s=Math.min(s,1);
  const scr=document.getElementById('screen');
  if(mock){ scr.style.width=''; scr.style.height=''; sz.style.width=W*s+'px'; sz.style.height=H*s+'px'; }
  else { /* real tablet: fill the whole screen, whatever its shape */
    scr.style.width=(vw/s)+'px'; scr.style.height=(vh/s)+'px';
    sz.style.width=vw+'px'; sz.style.height=vh+'px'; }
  dev.style.transform='scale('+s+')';
  document.body.style.background = mock ? '' : 'var(--bg)';
  document.getElementById('rotate').style.display = 'none';
}
function tick(){ const e=document.getElementById('clk'); if(e) e.textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
const fitSoon=()=>{ fit(); setTimeout(fit,150); setTimeout(fit,500); setTimeout(fit,1200); };
addEventListener('resize',fit); addEventListener('orientationchange',fitSoon); addEventListener('pageshow',fitSoon); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) fitSoon(); });
fitSoon(); tick(); setInterval(tick,30000);

document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pauseCheck(); });
